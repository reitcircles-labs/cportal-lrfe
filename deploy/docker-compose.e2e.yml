# The end-to-end tests against the containers (e2e: npm run test:docker, e2e/stack/start-docker.mjs).
# Never for a site: on top of docker-compose.yml it turns on what the tests need, as their own
# stack does (e2e/stack/start-backend.mjs): the demo users, invitation emails written to files the
# tests read, the canned AI, and the test blockchain with its test-only routes (NODE_ENV=test).
# Published on the test ports: the web app on 4300, the gateway on 3600 (the tests call it).

services:
  postgres:
    # the data is thrown away after the run: no waiting for the disk on each commit, as in the
    # tests' own PostgreSQL (start-backend.mjs). A site keeps the safe defaults.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]

  identity:
    # writes the emails into the tests' folder as the user running the tests, so they can read them
    user: "${E2E_UID:?}:${E2E_GID:?}"
    environment:
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?}
      MAIL_TRANSPORT: file
      MAIL_FILE_DIR: /mail
      MAIL_FROM: Deeds Registry (e2e) <noreply@example.com>
    volumes:
      - ${E2E_MAIL_DIR:?}:/mail

  intake:
    environment:
      EXTRACTION_PROVIDER: mock

  audit:
    environment:
      NODE_ENV: test
      CARDANO_PROVIDER: test
      AUDIT_TEST_ANCHORINGS: "true"

  extracts:
    environment:
      # extracts are sealed with the test seal (never with production); their PDFs are encrypted
      # with the test OpenBao like every stored file
      NODE_ENV: test

  openbao:
    # stored files are encrypted as at a site (API-795), with a throwaway OpenBao: development
    # mode, in memory, unsealed, with a fixed test root token (e2e/stack/start-docker.mjs runs
    # openbao-setup with it before the services start)
    command:
      - bao
      - server
      - -dev
      - -dev-root-token-id=${E2E_BAO_TOKEN:?}
      - -dev-listen-address=0.0.0.0:8200

  # The search service and the search engine in the tests (API-808), in their own profile, which
  # e2e/stack/start-docker.mjs turns on, so they start, and are removed, with the others. The
  # engine's index is in a throwaway volume instead of the encrypted host directory (README.md
  # part H): test data only. Its configuration, certificates, users and roles are made as at a site.
  search:
    profiles: ["e2e-search"]
  search-dir-check:
    profiles: ["e2e-search"]
    # the guard marks the throwaway volume, so the site's preparation runs unchanged
    entrypoint: ["sh", "-c", "touch /data/.lrfe-encrypted"]
    volumes:
      - e2e-search-data:/data
  search-prepare:
    profiles: ["e2e-search"]
    environment:
      OPENSEARCH_MIN_FREE_GB: "1"
    volumes:
      - e2e-search-data:/lrfe-search
  opensearch:
    profiles: ["e2e-search"]
    volumes:
      - e2e-search-data:/lrfe-search
  search-users:
    profiles: ["e2e-search"]

  gateway:
    ports:
      - "127.0.0.1:${E2E_API_PORT:-3600}:3500"
    environment:
      # the tests share one client address: the public check's limit high (its own unit tests)
      PUBLIC_RATE_LIMIT_MAX: "1000"

volumes:
  # the test search engine's index (see opensearch above)
  e2e-search-data:
