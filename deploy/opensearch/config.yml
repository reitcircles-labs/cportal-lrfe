# The search engine's sign-in (copied by deploy/opensearch/prepare.sh): each service signs in with
# its own user and password (HTTP basic over TLS); nobody without one. The administrator's
# certificate (service search-users) needs no entry here.
_meta:
  type: "config"
  config_version: 2
config:
  dynamic:
    http:
      anonymous_auth_enabled: false
    authc:
      basic_internal_auth_domain:
        http_enabled: true
        transport_enabled: true
        order: 0
        http_authenticator:
          type: basic
          challenge: true
        authentication_backend:
          type: intern
