# The whole application in containers, from images: the web app, the gateway, the seven backend
# services, PostgreSQL and NATS. How to install it at a site: README.md (next to this file).
#
#   docker compose up -d                     start (or upgrade to the LRFE_VERSION in .env)
#   docker compose ps                        every container and its health
#   COMPOSE_PROFILES=postgres,bao            (in .env, the default) the bundled PostgreSQL, and OpenBao:
#                                            stored files encrypted at rest, the audit wallet key, the
#                                            organisation seal on extracts. Without postgres, an
#                                            existing server (POSTGRES_HOST, README.md)
#   COMPOSE_PROFILES=postgres,bao,blockchain (in .env) also a blockchain node for anchoring
#   COMPOSE_PROFILES=postgres,bao,docs       (in .env) also the API docs (Swagger UI) on LRFE_DOCS_PORT
#   COMPOSE_PROFILES=postgres,bao,search     (in .env) also the search engine, on its encrypted
#                                            directory (README.md, parts H and I)
#
# Stored files (edrms, intake, extracts) are encrypted with keys from OpenBao by default
# (*_ENCRYPTION=bao): initialise, unseal and prepare OpenBao right after the first start (README.md, part D).
#
# On every start the one-shot db-setup creates or completes every service's schema and tables
# first; the services start only once it has finished.
#
# Every setting comes from .env next to this file (template: .env.example), and no secret is in an
# image. Data lives in named volumes (bottom), so containers can be replaced without losing it. Only
# the web app is published on the host (LRFE_BIND:LRFE_HTTP_PORT), and with the profile docs the API
# docs (LRFE_DOCS_PORT), which also pass calls straight to the services; otherwise the services, the
# database and the event bus are reachable only from the other containers. The images come from the
# export bundle (docker load) or are built from source with scripts/build.sh.

name: lrfe

x-logging: &logging
  # bounded logs: a site's disk must not fill up with container logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend: &backend
  image: lrfe-backend:${LRFE_VERSION:?set LRFE_VERSION in .env (the version to run, e.g. 0.1.0-5dc1dae)}
  restart: unless-stopped
  logging: *logging

x-env: &env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (48+ random characters, see README.md)}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HOST: 0.0.0.0
  # the services connect to NATS in the background and retry until it is up
  EVENT_BUS_DRIVER: nats
  NATS_URL: nats://nats:4222
  DB_CONNECTION_STRING: &db-url postgres://${POSTGRES_USER:-lrfe}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lrfe}${POSTGRES_URL_OPTIONS:-}
  DB_POOL_SIZE: "5"
  # the schema and tables are set up by db-setup before the services start, not by each service
  DB_SYNC: "false"

# The organisation running the portal (API-712): shown by the web app, and in identity's emails and
# audit's evidence packs. Taken from .env as they are (keys without a value): set but empty = not
# shown; not in .env at all = the first site's text (an older .env shows what it showed before).
x-org: &org
  LRFE_ORG_NAME:
  LRFE_ORG_SUBTITLE:
  LRFE_ORG_PARENT:
  LRFE_ORG_PLACE:

x-healthcheck: &healthcheck
  # node:22-slim has no curl; every service answers GET /health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

# edrms, intake, audit and extracts: their OpenBao login (role ID and secret ID), written by the openbao-setup
# service into the service's own volume. Without OpenBao the files are not there and nothing is read.
x-bao-command: &bao-command
  ["sh", "-c", "if [ -r /run/lrfe/bao/role-id ]; then BAO_ROLE_ID=$$(cat /run/lrfe/bao/role-id); export BAO_ROLE_ID; fi; exec node src/index.js"]

services:
  # The bundled database (profile postgres, on by default in .env). Without it, the services use an
  # existing PostgreSQL server: POSTGRES_HOST and the other POSTGRES_* settings (README.md).
  postgres:
    profiles: ["postgres"]
    image: postgres:16.15
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lrfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lrfe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Run on every start, before the services: creates every service's schema and tables, or adds
  # what a newer version needs, and exits. Waits up to 2 minutes for the database to answer (the
  # bundled one or an existing server); a wrong password or database name fails at once. Run again
  # while the services are up, it changes nothing and holds each table only for a moment.
  db-setup:
    <<: *backend
    restart: "no"
    command: ["node", "scripts/db-setup.js"]
    environment:
      DB_CONNECTION_STRING: *db-url

  # The event bus between the services, with JetStream for the durable events of the audit trail
  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    logging: *logging
    command: ["-js", "-sd", "/data", "-m", "8222", "-n", "lrfe"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  identity:
    <<: *backend
    working_dir: /app/services/identity
    command: ["node", "src/index.js"]
    environment:
      <<: [*env, *org]
      # the offices created on an empty database (README.md); empty: none
      IDENTITY_OFFICES: ${LRFE_OFFICES:-}
      PORT: "3501"
      IDENTITY_STORE: postgres
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_COOKIE_PATH: /api/auth
      # true behind HTTPS (the normal case); false only for a test install opened over plain http
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      IDENTITY_EXPOSE_INVITE_LINKS: ${IDENTITY_EXPOSE_INVITE_LINKS:-false}
      IDENTITY_INVITE_URL_BASE: ${LRFE_PUBLIC_URL:?set LRFE_PUBLIC_URL in .env (the address users open, e.g. https://deeds.example.gov)}/#/invite
      # invitation email: smtp | file | none (backend/services/identity/README.md in the source repository)
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-none}
      MAIL_FILE_DIR: /data/mail
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-}
      SMTP_FAMILY: ${SMTP_FAMILY:-}
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  edrms:
    <<: *backend
    working_dir: /app/services/edrms
    command: *bao-command
    environment:
      <<: *env
      PORT: "3502"
      EDRMS_STORE: postgres
      # local = files in the edrms-files volume; s3 needs the AWS_* settings
      EDRMS_STORAGE: ${EDRMS_STORAGE:-local}
      EDRMS_LOCAL_DIR: /data/edrms
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_BUCKET_REGION: ${AWS_BUCKET_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      EDRMS_MAX_FILE_MB: "200"
      EDRMS_URL_TTL_SECONDS: "300"
      EDRMS_COUNTRY_CODE: ${LRFE_COUNTRY_CODE:-NA}
      EDRMS_REGISTRY_CODE: ${LRFE_REGISTRY_CODE:-WDH}
      AUDIT_URL: http://audit:3506
      EDRMS_CONTENT_URL_BASE: /api/document-content
      # bao = stored files encrypted with keys from OpenBao (profile bao, README.md)
      EDRMS_ENCRYPTION: ${EDRMS_ENCRYPTION:-bao}
      BAO_ADDR: http://openbao:8200
      BAO_KEY_NAME: edrms-files
      BAO_SECRET_ID_FILE: /run/lrfe/bao/secret-id
      # the search engine (profile search): its address, and the login made by search-prepare
      # (user, password, ca.pem); not there without the profile
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_LOGIN_DIR: /run/lrfe/search
    volumes:
      - edrms-files:/data/edrms
      - bao-edrms:/run/lrfe/bao:ro
      - search-login-edrms:/run/lrfe/search:ro
    networks: [default, bao, search]
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  bpm:
    <<: *backend
    working_dir: /app/services/bpm
    command: ["node", "src/index.js"]
    environment:
      <<: *env
      PORT: "3503"
      BPM_STORE: postgres
      EDRMS_URL: http://edrms:3502
      # called only when a land record review is decided (no start-up dependency)
      RECORDS_URL: http://land-records:3505
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      edrms: { condition: service_healthy }

  intake:
    <<: *backend
    working_dir: /app/services/intake
    command: *bao-command
    environment:
      <<: *env
      PORT: "3504"
      INTAKE_STORE: postgres
      INTAKE_STORAGE: local
      INTAKE_LOCAL_DIR: /data/intake
      INTAKE_MAX_FILE_MB: "50"
      INTAKE_REGISTRY_CODE: ${LRFE_REGISTRY_CODE:-WDH}
      EDRMS_URL: http://edrms:3502
      # mock = canned answer, no API key, no cost (testing only); gemini needs GEMINI_API_KEY
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_ESCALATION_MODEL: ${GEMINI_ESCALATION_MODEL:-gemini-3.1-pro-preview}
      EXTRACTION_MONTHLY_BUDGET_USD: ${EXTRACTION_MONTHLY_BUDGET_USD:-50}
      # the automatic cross-check of extracted fields (backend/services/intake/README.md in the source repository)
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_PROVIDER: ${JEV_PROVIDER:-}
      JEV_MODEL: ${JEV_MODEL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      INTAKE_RUN_WORKER: "true"
      INTAKE_ENCRYPTION: ${INTAKE_ENCRYPTION:-bao}
      BAO_ADDR: http://openbao:8200
      BAO_KEY_NAME: intake-files
      BAO_SECRET_ID_FILE: /run/lrfe/bao/secret-id
    volumes:
      - intake-files:/data/intake
      - bao-intake:/run/lrfe/bao:ro
    networks: [default, bao]
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      edrms: { condition: service_healthy }

  land-records:
    <<: *backend
    working_dir: /app/services/land-records
    command: ["node", "src/index.js"]
    environment:
      <<: *env
      PORT: "3505"
      RECORDS_STORE: postgres
      RECORDS_COUNTRY_CODE: ${LRFE_COUNTRY_CODE:-NA}
      IDENTITY_URL: http://identity:3501
      EDRMS_URL: http://edrms:3502
      BPM_URL: http://bpm:3503
      AUDIT_URL: http://audit:3506
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      identity: { condition: service_healthy }
      edrms: { condition: service_healthy }

  audit:
    <<: *backend
    working_dir: /app/services/audit
    command: *bao-command
    environment:
      <<: [*env, *org]
      PORT: "3506"
      AUDIT_STORE: postgres
      RECORDS_URL: http://land-records:3505
      EDRMS_URL: http://edrms:3502
      BPM_URL: http://bpm:3503
      # anchoring on the blockchain: empty = off; ogmios = through the node of the profile blockchain,
      # with the wallet key in OpenBao (profile bao). README.md, "Blockchain anchoring".
      CARDANO_PROVIDER: ${CARDANO_PROVIDER:-}
      CARDANO_NETWORK: ${CARDANO_NETWORK:-preview}
      OGMIOS_URL: http://cardano:1337
      ANCHOR_PERIOD: ${ANCHOR_PERIOD:-1h}
      ANCHOR_MIN_BALANCE_ADA: ${ANCHOR_MIN_BALANCE_ADA:-5}
      ANCHOR_BAO_KEY: audit-anchor
      BAO_ADDR: http://openbao:8200
      BAO_SECRET_ID_FILE: /run/lrfe/bao/secret-id
    volumes:
      - bao-audit:/run/lrfe/bao:ro
    networks: [default, bao]
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  extracts:
    <<: *backend
    working_dir: /app/services/extracts
    command: *bao-command
    environment:
      # the organisation's name is on the extract's PDF
      <<: [*env, *org]
      PORT: "3507"
      EXTRACTS_STORE: postgres
      # the record's current version and its owners, read when an extract is issued, whether that
      # version is on the blockchain yet, and its proof (attached inside the PDF)
      RECORDS_URL: http://land-records:3505
      AUDIT_URL: http://audit:3506
      # the sealed PDFs, kept as issued for "download again": in the extracts-files volume
      EXTRACTS_STORAGE: local
      EXTRACTS_LOCAL_DIR: /data/extracts
      # the public check page the extract's QR code opens: <address>/<token>; empty: the portal's
      # own address (LRFE_PUBLIC_URL) with /#/check
      EXTRACTS_CHECK_URL_BASE: ${LRFE_EXTRACT_CHECK_URL:-}
      LRFE_PUBLIC_URL: ${LRFE_PUBLIC_URL:?set LRFE_PUBLIC_URL in .env (the address users open, e.g. https://deeds.example.gov)}
      # what the extract certifies, in the registry's words; empty: a placeholder saying so
      EXTRACTS_LEGAL_TEXT: ${LRFE_EXTRACT_LEGAL_TEXT:-}
      # the time zone of the dates printed on the extract (e.g. Africa/Windhoek); empty: UTC
      EXTRACTS_TIME_ZONE: ${LRFE_TIME_ZONE:-}
      # the country in the extract number (EX-NA-2026-000012), as in record numbers
      EXTRACTS_COUNTRY_CODE: ${LRFE_COUNTRY_CODE:-NA}
      # the registry's coat of arms beside its name (LRFE_COAT_OF_ARMS, mounted below); empty: none
      EXTRACTS_COAT_OF_ARMS_FILE: ${LRFE_COAT_OF_ARMS:+/run/lrfe/coat-of-arms}
      # the organisation seal on the PDF: bao = its key in OpenBao (profile bao) and its certificate
      # (LRFE_SEAL_CERT); empty = no seal, and no extract can be issued (README.md, part D)
      EXTRACTS_SEAL: ${LRFE_SEAL:-}
      EXTRACTS_SEAL_KEY: extracts-seal
      EXTRACTS_SEAL_CERT: ${LRFE_SEAL_CERT:-}
      # bao = the stored PDFs encrypted with keys from OpenBao (profile bao, README.md), as edrms
      EXTRACTS_ENCRYPTION: ${EXTRACTS_ENCRYPTION:-bao}
      BAO_KEY_NAME: extracts-files
      BAO_ADDR: http://openbao:8200
      BAO_SECRET_ID_FILE: /run/lrfe/bao/secret-id
    volumes:
      - extracts-files:/data/extracts
      - bao-extracts:/run/lrfe/bao:ro
      # without a coat of arms, an empty file in its place that is never read
      - ${LRFE_COAT_OF_ARMS:-/dev/null}:/run/lrfe/coat-of-arms:ro
    networks: [default, bao]
    healthcheck: *healthcheck
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  # The search service (profile search, API-802): follows intake's and edrms' document events with
  # durable consumers, so it catches up after a stop, and fetches each document with its own
  # service token. Reached on the internal networks only; its lag is at /health/events.
  search:
    <<: *backend
    profiles: ["search"]
    working_dir: /app/services/search
    command: ["node", "src/index.js"]
    environment:
      <<: *env
      PORT: "3508"
      INTAKE_URL: http://intake:3504
      EDRMS_URL: http://edrms:3502
    networks: [default, search]
    healthcheck: *healthcheck
    depends_on:
      nats: { condition: service_healthy }

  gateway:
    <<: *backend
    working_dir: /app/services/gateway
    command: ["node", "src/index.js"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: "3500"
      IDENTITY_URL: http://identity:3501
      EDRMS_URL: http://edrms:3502
      BPM_URL: http://bpm:3503
      INTAKE_URL: http://intake:3504
      RECORDS_URL: http://land-records:3505
      AUDIT_URL: http://audit:3506
      EXTRACTS_URL: http://extracts:3507
      CORS_ORIGINS: ${LRFE_PUBLIC_URL}
    healthcheck: *healthcheck
    depends_on:
      identity: { condition: service_healthy }
      edrms: { condition: service_healthy }
      bpm: { condition: service_healthy }
      intake: { condition: service_healthy }
      land-records: { condition: service_healthy }
      audit: { condition: service_healthy }
      extracts: { condition: service_healthy }

  # The web app, and /api/... passed to the gateway: the only container published on the host
  web:
    image: lrfe-web:${LRFE_VERSION:?set LRFE_VERSION in .env}
    restart: unless-stopped
    logging: *logging
    # written into /config.json on start (angular-app/docker/site-config.sh)
    environment: *org
    ports:
      - "${LRFE_BIND:-127.0.0.1}:${LRFE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      gateway: { condition: service_healthy }

  # ---- optional: the API docs, Swagger UI (profile docs) ----
  # Published like the web app (LRFE_BIND); "Try it out" goes to the gateway (/api/...) or straight
  # to one service (/direct/<name>/...). The page loads Swagger UI from a public CDN.
  docs:
    profiles: ["docs"]
    <<: *backend
    command: ["node", "scripts/docs-server.js"]
    environment:
      DOCS_HOST: 0.0.0.0
      DOCS_PORT: "3510"
      GATEWAY_URL: http://gateway:3500
      DOCS_SERVICE_HOSTS: names
    ports:
      - "${LRFE_BIND:-127.0.0.1}:${LRFE_DOCS_PORT:-3510}:3510"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3510/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      gateway: { condition: service_healthy }

  # ---- OpenBao (profile bao, on by default) ----
  # Keys for stored files (edrms, intake, extracts), the audit service's blockchain wallet key and
  # the organisation seal on ownership extracts (extracts). Started
  # sealed: an administrator initialises it once and unseals it after every start (README.md).
  openbao:
    profiles: ["bao"]
    image: openbao/openbao:2.7.1
    restart: unless-stopped
    logging: *logging
    command: ["server"]
    environment:
      # OpenBao 2.x never locks memory: nothing to grant
      SKIP_SETCAP: "true"
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - bao-data:/openbao/file
    networks: [bao]

  # Run once after initialising OpenBao (and again at any time: it changes nothing that works):
  #   docker compose run --rm openbao-setup
  # Creates the keys, a policy and a login per service, and puts each login into that service's volume.
  openbao-setup:
    profiles: ["bao-setup"]
    image: openbao/openbao:2.7.1
    user: "0"
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./openbao/setup.sh:/setup/setup.sh:ro
      - bao-edrms:/approle/edrms
      - bao-intake:/approle/intake
      - bao-audit:/approle/audit
      - bao-extracts:/approle/extracts
      - bao-search-dir:/approle/search-dir
    networks: [bao]

  # ---- the search engine's encrypted directory (API-799, README.md part H) ----
  # scripts/search_dir.py runs this to get the directory's key from OpenBao (create, unlock);
  # it prints the key to the script's pipe and writes nothing. Never run by hand.
  search-dir-key:
    profiles: ["search-dir"]
    image: openbao/openbao:2.7.1
    user: "1000"
    # what it prints is the key: never into a log file on the disk
    logging:
      driver: none
    entrypoint: ["sh", "/setup/search-dir-key.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./openbao/search-dir-key.sh:/setup/search-dir-key.sh:ro
      - bao-search-dir:/approle/search-dir:ro
    networks: [bao]

  # The start guard: succeeds only when OPENSEARCH_DATA_DIR is the encrypted directory and it is
  # unlocked (its marker file can be read only then). The search engine starts after it, so it never
  # writes an index into a plain or a locked directory. Never creates the directory.
  search-dir-check:
    profiles: ["search"]
    image: openbao/openbao:2.7.1
    user: "0"
    entrypoint:
      - sh
      - -c
      - >-
        test -f /data/.lrfe-encrypted || { echo "the search engine's directory (OPENSEARCH_DATA_DIR)
        is not unlocked or not encrypted: python3 scripts/search_dir.py status" >&2; exit 1; }
    network_mode: none
    volumes:
      - type: bind
        source: ${OPENSEARCH_DATA_DIR:-./opensearch-data-not-set}
        target: /data
        read_only: true
        bind:
          create_host_path: false

  # ---- optional: the search engine (profile search, API-800, README.md part I) ----
  # Before every start, after the guard: the directory's subfolders, the configuration, the
  # certificates and the services' logins (opensearch/prepare.sh). Changes nothing that works.
  search-prepare:
    profiles: ["search"]
    image: &opensearch-image opensearchproject/opensearch:3.9.0
    user: "0"
    entrypoint: ["bash", "/lrfe/prepare.sh"]
    environment:
      OPENSEARCH_MIN_FREE_GB: ${OPENSEARCH_MIN_FREE_GB:-100}
    network_mode: none
    volumes:
      - &search-dir
        type: bind
        source: ${OPENSEARCH_DATA_DIR:-./opensearch-data-not-set}
        target: /lrfe-search
        bind:
          create_host_path: false
      - ./opensearch:/lrfe:ro
      - search-config:/config
      - search-login-search:/login/search
      - search-login-edrms:/login/edrms
    depends_on:
      search-dir-check: { condition: service_completed_successfully }

  # The search engine: one node, its index in the encrypted directory, reachable only on the
  # network search (edrms and the search service), over TLS, each service with its own user.
  opensearch:
    profiles: ["search"]
    image: *opensearch-image
    restart: unless-stopped
    logging: *logging
    environment:
      # its own configuration (search-prepare), never the demo one
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
    mem_limit: ${OPENSEARCH_MEMORY:-2g}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - *search-dir
      - search-config:/usr/share/opensearch/config
    networks: [search]
    healthcheck:
      # as the administrator (its certificate): the cluster answers and its indexes are usable
      test:
        - CMD-SHELL
        - >-
          cd /usr/share/opensearch/config/certs && curl -sf --cacert ca.pem --cert-type P12
          --cert "admin.p12:$$(cat password)" 'https://localhost:9200/_cluster/health?timeout=5s'
          | grep -Eq '"status":"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    depends_on:
      search-prepare: { condition: service_completed_successfully }

  # After every start of the search engine: applies the users and roles of the configuration (a
  # newer version's roles, a login made again), with the administrator's certificate.
  search-users:
    profiles: ["search"]
    image: *opensearch-image
    entrypoint:
      - bash
      - -c
      - >-
        set -o pipefail && cd /usr/share/opensearch/config/certs && pass=$$(cat password) &&
        /usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh -h opensearch
        -cd ../opensearch-security -icl -nhnv -cacert ca.pem
        -ks admin.p12 -kst PKCS12 -kspass "$$pass" -ksalias admin
        -ts truststore.p12 -tst PKCS12 -tspass "$$pass" | tail -n 3
    volumes:
      - search-config:/usr/share/opensearch/config:ro
    networks: [search]
    depends_on:
      opensearch: { condition: service_healthy }

  # ---- optional: blockchain node with Ogmios (profile blockchain) ----
  # The audit service anchors through it (CARDANO_PROVIDER=ogmios). The first sync of the preview
  # network takes about 11 hours and 16 GB.
  cardano:
    profiles: ["blockchain"]
    image: cardanosolutions/cardano-node-ogmios:v7.0.0_11.0.1-${CARDANO_NETWORK:-preview}
    restart: unless-stopped
    logging: *logging
    volumes:
      - cardano-db:/db

networks:
  default:
  # OpenBao's network: only OpenBao, its setup and the services that use it (edrms, intake, audit,
  # extracts, and search-dir-key for the search engine's directory)
  # reach it; no way out of the machine (internal)
  bao:
    internal: true
  # The search engine's network: only the search engine, its user setup and the services that use
  # it (edrms reads; the search service, API-802, writes); no port on the host, no way out (internal)
  search:
    internal: true

volumes:
  pgdata:
  natsdata:
  edrms-files:
  intake-files:
  extracts-files:
  bao-data:
  bao-edrms:
  bao-intake:
  bao-audit:
  bao-extracts:
  bao-search-dir:
  # the search engine's configuration and certificates, and each service's login to it
  search-config:
  search-login-search:
  search-login-edrms:
  cardano-db:
