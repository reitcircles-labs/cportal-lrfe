      x-access:
        allOf:
          - audit.view
      x-gateway-path: /api/audit/records/{id}/check
  /audit/signoffs:
    post:
      tags:
        - Sign-off
      summary: Sign off the open audit checkpoint of a land record
      description: >-
        Body `{ recordId, comment? }`. One sign-off for every version committed since the last one, checked again now: accepted only when
        everything is in a block on the blockchain, everything matches it, and no finding is open. 201 with the sign-off (`kind:
        "checkpoint"`, `fromVersion`, `toVersion`, `seal` of the top version, `items` with the version and document seals and the finding
        ids, `signedByName`, `signedAt`). 403 `{ details: { rule: "sod2" } }` for whoever holds `record.finalize` or approved a version in
        the range; 409 not on the blockchain yet, changed since review, an open finding, nothing to audit, or signed off by someone else at
        the same moment; 503 when the check could not run. Also a trail entry (`audit.signoff.recorded`), anchored with the next root.


        **Access:** Signed-in user with permission `audit.signoff`.
      operationId: postAuditSignoffs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordId
              additionalProperties: false
              properties:
                recordId:
                  type: string
                  format: uuid
                comment:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - audit.signoff
      x-gateway-path: /api/audit/signoffs
    get:
      tags:
        - Sign-off
      summary: Sign-offs of a land record or document
      description: |-
        `{ items }`, oldest first; `recordId` and/or `documentId`.

        **Access:** Signed-in user with permission `audit.view`.
      operationId: getAuditSignoffs
      parameters:
        - name: recordId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: documentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
