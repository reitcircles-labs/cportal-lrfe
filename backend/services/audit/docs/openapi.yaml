  /audit/records:
    get:
      tags:
        - Sign-off
      summary: The land records list of the Audit screen
      description: >-
        `filter`: `changed` (a version committed since the last audit sign-off; the default), `attention` (an open finding, or an item found
        changed since review and not re-reviewed yet) or `all`; `q` searches as land-records does; `limit` (up to 100) and `offset`. `{
        items, total, counts: { changed, attention, all } }`. Each item: `id`, `recordNo`, `label`, `currentVersion`, `changedAt`, `owners`,
        `proof` (the current version's anchoring: `waiting`, `sent`, `onChain`, `confirmed`), `needsAttention`, and `audit`: `range` (the
        open checkpoint, or null), `newDocuments`, `check` (`matches`, `changed`, `notOnChain`: what is known as of the last check; the
        record's own check runs it again), `openFindings`, `lastSignoff` (`toVersion`, `signedAt`, `signedByName`, and `proof`: how far its
        trail entry has got, `waiting`, `sent`, `onChain` or `confirmed`).


        **Access:** Signed-in user with permission `audit.view`.
      operationId: getAuditRecords
      parameters:
