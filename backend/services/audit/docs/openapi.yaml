# Generated by backend/scripts/openapi.js from the routes and docs/endpoints.js.
# Do not edit by hand: change those and run `npm run docs` in backend/.
openapi: 3.1.0
info:
  title: audit service
  version: 0.1.0
  description: >-
    Audit: a tamper-evident trail with one hash-chained entry per domain event of every service. Proofs anchored on Cardano, sign-off and
    evidence packs follow. Design: services/audit/README.md.


    Paths here are the service's own, on port 3506. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3506
    description: audit directly (local development)
tags:
  - name: Trail
    description: The audit trail and its hash chain.
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /audit/trail:
    get:
      tags:
        - Trail
      summary: Trail entries, oldest first
      description: >-
        `{ total, subjects, entries }`. Each entry has `seq`, `eventId`, `type`, `source`, `time`, `actor`, `subjects`, `data`, `prevHash`,
        `contentHash` and `hash`. `subject` is `record:<id>`, `document:<id>`, `edrmsNo:<number>`, `intake:<id>`, `process:<id>` or
        `user:<id>`. A land record or document also brings in the steps of what it is made of: its documents' capture, filing and
        amendments, and its review processes. Other records' steps are left out; `subjects` lists what was included. `type` is an event
        type, or a prefix ending in a dot (`intake.`). `from` and `to` are dates on the event's time (`to` is exclusive).


        **Access:** Signed-in user with permission `audit.view`.
      operationId: getAuditTrail
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: from
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: to
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - audit.view
      x-gateway-path: /api/audit/trail
  /audit/trail/verify:
    get:
      tags:
        - Trail
      summary: Recompute the trail's hash chain
      description: >-
        `{ intact: true, entries, head: { seq, hash, time } }`, or `{ intact: false, entries, brokenAt, problem }`, where `problem` is
        `changed`, `missing`, `out of order` or `does not follow the entry before it`. `entries` is how many entries were checked before the
        break.


        **Access:** Signed-in user with permission `audit.view`.
      operationId: getAuditTrailVerify
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - audit.view
      x-gateway-path: /api/audit/trail/verify
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/auth/login or /api/auth/mfa (15 minutes; renew with POST /api/auth/refresh).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token (typ "service"), signed with the shared JWT_SECRET. Not available to browsers.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lrfe_rt
      description: httpOnly refresh cookie, path /api/auth, set at sign-in.
  schemas:
    Error:
      type: object
      required:
        - status
        - message
        - timestamp
        - path
      properties:
        status:
          type: string
          example: Forbidden
          description: HTTP status text
        message:
          type: string
          example: Not permitted
        details:
          description: Extra data on some errors, e.g. `{ perm }` on 403, `{ blockers }` when a document cannot be filed yet
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /users
