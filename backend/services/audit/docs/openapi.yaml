      x-gateway-path: /api/audit/records
  /audit/records/{id}/check:
    get:
      tags:
        - Sign-off
      summary: The open audit checkpoint of a land record
      description: >-
        What the next audit sign-off covers: `range { from, to }` (every version committed since the last audit sign-off, or null),
        `lastSignoff`, `versions` and `documents` (the document versions they added that no earlier sign-off covered), each with `anchoring`
        (`waiting`, `sent`, `onChain`, `confirmed`) and `match` (`matches`, `changed`, `notOnChain`, `unavailable`; a changed one also
        `superseded` once a re-reviewed version matches), `openFindings`, and `canSignOff` with the `reason` when not, for the user asking.
        A changed item starts a re-review task for the records desk the first time it is found (bpm process `audit-rereview`).


        **Access:** Signed-in user with permission `audit.view`.
      operationId: getAuditRecordsIdCheck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
