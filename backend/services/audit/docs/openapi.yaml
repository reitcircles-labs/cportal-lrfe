  /audit/findings/{id}/close:
    post:
      tags:
        - Sign-off
      summary: Close a finding, answering it
      description: >-
        Body `{ outcome, answer }`: `agreed` (resolved by agreement outside the portal, for example in a meeting) or `mistake` (raised by
        mistake), and the answer: who agreed, when, what was decided. `{ reason }` alone is read as `{ outcome: "mistake", answer: reason
        }`. 409 when it is no longer open. Its inbox tasks are withdrawn if still open. A trail entry (`audit.finding.closed` with the
        `outcome`, and the thread under `Findings`); a newer reviewed version closes it the same way with `outcome: "resolved"`.


        **Access:** Signed-in user with permission `audit.signoff`.
      operationId: postAuditFindingsIdClose
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required:
                    - answer
                - required:
                    - reason
              properties:
                outcome:
                  type: string
                  enum:
                    - agreed
                    - mistake
                answer:
                  type: string
                  maxLength: 4000
                reason:
                  type: string
                  maxLength: 2000
      responses:
