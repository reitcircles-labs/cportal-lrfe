      summary: The evidence pack of a land record (zip)
      description: >-
        Every committed version with its seal, the pinned document versions (metadata and files), the record's trail, sign-offs, findings, a
        proof for each version, document version and trail entry, `manifest.json` (every file's SHA-256) and `README.txt`. Check it with the
        offline verifier: `node lrfe-verify.mjs <pack>.zip --address <wallet>`. The export is a trail entry (`audit.evidence.exported`, with
        the manifest's SHA-256, also in the `x-manifest-sha256` header). 409 when the record has no committed version.


        **Access:** Signed-in user with permission `audit.export`.
      operationId: getAuditRecordsIdEvidence
