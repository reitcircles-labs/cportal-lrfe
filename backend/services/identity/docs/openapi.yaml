# Generated by backend/scripts/openapi.js from the routes and docs/endpoints.js.
# Do not edit by hand: change those and run `npm run docs` in backend/.
openapi: 3.1.0
info:
  title: identity service
  version: 0.1.0
  description: >-
    Sign-in with MFA, sessions, users, roles, security policies and the admin access log.


    Paths here are the service's own, on port 3501. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3501
    description: identity directly (local development)
tags:
  - name: Auth
    description: Sign-in, MFA, sessions. The refresh token is an httpOnly cookie `lrfe_rt` (path /api/auth), never visible to JavaScript.
  - name: Users
    description: User administration (permission admin.users).
  - name: Roles
    description: The six fixed roles and their permissions.
  - name: Policies
    description: Security policies and segregation-of-duties rules.
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /auth/login:
    post:
      tags:
        - Auth
      summary: Sign in with email and password
      description: >-
        Signed in: `{ accessToken, expiresIn, me }` and the refresh cookie is set. When MFA is required: `{ next: "mfa", challenge }`, or on
        first use `{ next: "mfa-enroll", challenge, secret, otpauthUrl }`; continue with POST /auth/mfa. Wrong email or password, or a user
        who is not active: 401/403.


        **Access:** Public: no token needed.
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  maxLength: 320
                password:
                  type: string
                  maxLength: 1024
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      x-gateway-path: /api/auth/login
  /auth/mfa:
    post:
      tags:
        - Auth
      summary: "Second step: the 6-digit authenticator code"
      description: >-
        Takes the `challenge` from /auth/login. On first use this also enrols the authenticator. Returns `{ accessToken, expiresIn, me }`
        and sets the refresh cookie.


        **Access:** Public: no token needed.
      operationId: postAuthMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challenge
                - code
              properties:
                challenge:
                  type: string
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      x-gateway-path: /api/auth/mfa
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: New access token from the refresh cookie
      description: |-
        Rotates the refresh cookie. 401 when the session ended (idle timeout, sign-out, suspension, replayed token).

        **Access:** Uses the httpOnly refresh cookie `lrfe_rt` (sent automatically by the browser to /api/auth).
      operationId: postAuthRefresh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - refreshCookie: []
      x-gateway-path: /api/auth/refresh
  /auth/logout:
    post:
      tags:
        - Auth
      summary: "Sign out: ends the session and clears the cookie"
      description: "**Access:** Uses the httpOnly refresh cookie `lrfe_rt` (sent automatically by the browser to /api/auth)."
      operationId: postAuthLogout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - refreshCookie: []
      x-gateway-path: /api/auth/logout
  /invitations/accept:
    post:
      tags:
        - Auth
      summary: Accept an invitation and set a password
      description: |-
        Token from the invitation link; password at least 12 characters. Returns `{ email }`; the user then signs in.

        **Access:** Public: no token needed.
      operationId: postInvitationsAccept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  maxLength: 200
                password:
                  type: string
                  maxLength: 1024
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      x-gateway-path: /api/invitations/accept
  /auth/me:
    get:
      tags:
        - Auth
      summary: The signed-in user
      description: |-
        User, roles, permissions, home route, and the timeout / four-eyes policy.

        **Access:** Any signed-in user.
      operationId: getAuthMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/auth/me
  /catalogue:
    get:
      tags:
        - Roles
      summary: Permission catalogue
      description: |-
        `{ groups, perms, roles }`: permission groups, every permission with its label, and the roles.

        **Access:** Any signed-in user.
      operationId: getCatalogue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/catalogue
  /roles:
    get:
      tags:
        - Roles
      summary: The six roles with their permissions
      description: "**Access:** Any signed-in user."
      operationId: getRoles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/roles
  /users:
    get:
      tags:
        - Users
      summary: All users
      description: |-
        With their roles, status, MFA state and segregation-of-duties conflicts.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: getUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users
    post:
      tags:
        - Users
      summary: Invite a user
      description: >-
        Creates the user as Invited and emails them the activation link (valid 3 days). Returns `{ user, email: { sent, to, reason? },
        inviteUrl? }`: the user is created even when the email fails, and `reason` says why. `inviteUrl` is only returned when
        IDENTITY_EXPOSE_INVITE_LINKS=true (dev).


        **Access:** Signed-in user with permission `admin.users`.
      operationId: postUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - email
                - roles
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                email:
                  type: string
                  format: email
                  maxLength: 320
                office:
                  type: string
                  maxLength: 200
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - sup
                      - scan
                      - rev
                      - rec
                      - aud
                      - adm
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users
  /users/{id}/roles:
    put:
      tags:
        - Users
      summary: Set a user's roles
      description: |-
        You cannot change your own roles; no change may leave zero active administrators.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: putUsersIdRoles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - roles
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - sup
                      - scan
                      - rev
                      - rec
                      - aud
                      - adm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users/{id}/roles
  /users/{id}/suspend:
    post:
      tags:
        - Users
      summary: Suspend a user
      description: >-
        Blocks sign-in and ends their sessions; history is kept. Optional `{ reason }` for the access log. You cannot suspend yourself or
        the last administrator.


        **Access:** Signed-in user with permission `admin.users`.
      operationId: postUsersIdSuspend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users/{id}/suspend
  /users/{id}/reactivate:
    post:
      tags:
        - Users
      summary: Reactivate a suspended user
      description: |-
        Optional `{ reason }`. A user suspended before accepting their invitation goes back to Invited.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: postUsersIdReactivate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users/{id}/reactivate
  /users/{id}/mfa-reset:
    post:
      tags:
        - Users
      summary: Reset a user's MFA
      description: |-
        They enrol a new authenticator at their next sign-in.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: postUsersIdMfaReset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users/{id}/mfa-reset
  /users/{id}/invitation:
    post:
      tags:
        - Users
      summary: Send a new invitation
      description: |-
        Only for users still Invited. Emails a new link (earlier links stop working). Returns `{ email, inviteUrl? }` as for POST /users.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: postUsersIdInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/users/{id}/invitation
  /roles/permissions:
    put:
      tags:
        - Roles
      summary: Save the role × permission matrix
      description: |-
        `{ matrix: { roleId: [permission] } }`. Refused if no active user would keep admin.roles. Returns `{ roles, changes }`.

        **Access:** Signed-in user with permission `admin.roles`.
      operationId: putRolesPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - matrix
              properties:
                matrix:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.roles
      x-gateway-path: /api/roles/permissions
  /policies:
    get:
      tags:
        - Policies
      summary: Security policies and segregation-of-duties rules
      description: "**Access:** Signed-in user with any of `admin.policies`, `admin.users`."
      operationId: getPolicies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        anyOf:
          - admin.policies
          - admin.users
      x-gateway-path: /api/policies
    put:
      tags:
        - Policies
      summary: Save policies and switch rules on or off
      description: |-
        Returns `{ policies, sod, changes }`.

        **Access:** Signed-in user with permission `admin.policies`.
      operationId: putPolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - policies
              properties:
                policies:
                  type: object
                  additionalProperties: false
                  required:
                    - mfa
                    - eid
                    - ipAllow
                    - timeout
                    - fourEyes
                  properties:
                    mfa:
                      type: boolean
                    eid:
                      type: boolean
                    ipAllow:
                      type: boolean
                    timeout:
                      type: integer
                    fourEyes:
                      type: boolean
                sod:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - "on"
                    properties:
                      id:
                        type: string
                      "on":
                        type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.policies
      x-gateway-path: /api/policies
  /access-log:
    get:
      tags:
        - Users
      summary: Admin access log
      description: |-
        Sign-ins, denials, user, role and policy changes, newest first. `{ items, total }`.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: getAccessLog
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - role
              - user
              - policy
              - denied
              - session
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
      x-gateway-path: /api/access-log
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/auth/login or /api/auth/mfa (15 minutes; renew with POST /api/auth/refresh).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token (typ "service"), signed with the shared JWT_SECRET. Not available to browsers.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lrfe_rt
      description: httpOnly refresh cookie, path /api/auth, set at sign-in.
  schemas:
    Error:
      type: object
      required:
        - status
        - message
        - timestamp
        - path
      properties:
        status:
          type: string
          example: Forbidden
          description: HTTP status text
        message:
          type: string
          example: Not permitted
        details:
          description: Extra data on some errors, e.g. `{ perm }` on 403, `{ blockers }` when a document cannot be filed yet
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /users
