# Generated by backend/scripts/openapi.js from the routes and docs/endpoints.js.
# Do not edit by hand: change those and run `npm run docs` in backend/.
openapi: 3.1.0
info:
  title: cportal-lrfe API (through the gateway)
  version: 0.1.0
  description: >-
    Every endpoint the browser can reach, at its /api/... path. The gateway only forwards requests: each service checks the token and
    permissions itself. Service-only endpoints are listed too, but answer 401 to a user token.


    In development, `ng serve` proxies /api to the gateway (angular-app/proxy.conf.json), so the paths work from the app's origin as they
    are.
servers:
  - url: http://localhost:3500
    description: gateway (local development)
tags:
  - name: identity · Auth
    description: Sign-in, MFA, sessions. The refresh token is an httpOnly cookie `lrfe_rt` (path /api/auth), never visible to JavaScript.
  - name: identity · Roles
    description: The six fixed roles and their permissions.
  - name: identity · Users
    description: User administration (permission admin.users).
  - name: identity · Offices
    description: >-
      Office locations (registry offices and external bodies). Users other than system administrators belong to one. Offices are never
      deleted.
  - name: identity · Policies
    description: Security policies and segregation-of-duties rules.
  - name: edrms · Service
    description: Health and metadata.
  - name: edrms · Filing
    description: "Service-to-service writes. Browsers cannot call these: they need a service token."
  - name: edrms · Documents
    description: Filed documents of record, their versions and content.
  - name: bpm · Processes
    description: Process definitions and starting instances.
  - name: bpm · Instances
    description: Running and finished process instances.
  - name: bpm · Tasks
    description: The signed-in user's task inbox.
  - name: intake · Service
    description: Health, catalogue and AI cost.
  - name: intake · Capture
    description: Batches and uploads (permission capture.scan).
  - name: intake · Documents
    description: Captured documents and their extraction results.
  - name: intake · Review
    description: >-
      Field review (verify.edit) and filing or rejecting (verify.file). Changes claim the document for 30 minutes so two reviewers do not
      collide.
  - name: land-records · Service
    description: Health and metadata.
  - name: land-records · Records
    description: Land records, their versions and seal chain.
  - name: gateway
    description: The gateway itself.
paths:
  /api/access-log:
    get:
      tags:
        - identity · Users
      summary: Admin access log
      description: |-
        Sign-ins, denials, user, role and policy changes, newest first. `{ items, total }`.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: identity_getAccessLog
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - role
              - user
              - policy
              - denied
              - session
              - office
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
  /api/auth/login:
    post:
      tags:
        - identity · Auth
      summary: Sign in with email and password
      description: >-
        Signed in: `{ accessToken, expiresIn, me }` and the refresh cookie is set. When MFA is required: `{ next: "mfa", challenge }`, or on
        first use `{ next: "mfa-enroll", challenge, secret, otpauthUrl }`; continue with POST /auth/mfa. Wrong email or password, or a user
        who is not active: 401/403.


        **Access:** Public: no token needed.
      operationId: identity_postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  maxLength: 320
                password:
                  type: string
                  maxLength: 1024
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /api/auth/logout:
    post:
      tags:
        - identity · Auth
      summary: "Sign out: ends the session and clears the cookie"
      description: "**Access:** Uses the httpOnly refresh cookie `lrfe_rt` (sent automatically by the browser to /api/auth)."
      operationId: identity_postAuthLogout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - refreshCookie: []
  /api/auth/me:
    get:
      tags:
        - identity · Auth
      summary: The signed-in user
      description: |-
        User, roles, permissions, home route, and the timeout / four-eyes policy.

        **Access:** Any signed-in user.
      operationId: identity_getAuthMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
  /api/auth/mfa:
    post:
      tags:
        - identity · Auth
      summary: "Second step: the 6-digit authenticator code"
      description: >-
        Takes the `challenge` from /auth/login. On first use this also enrols the authenticator. Returns `{ accessToken, expiresIn, me }`
        and sets the refresh cookie.


        **Access:** Public: no token needed.
      operationId: identity_postAuthMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challenge
                - code
              properties:
                challenge:
                  type: string
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /api/auth/refresh:
    post:
      tags:
        - identity · Auth
      summary: New access token from the refresh cookie
      description: |-
        Rotates the refresh cookie. 401 when the session ended (idle timeout, sign-out, suspension, replayed token).

        **Access:** Uses the httpOnly refresh cookie `lrfe_rt` (sent automatically by the browser to /api/auth).
      operationId: identity_postAuthRefresh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - refreshCookie: []
