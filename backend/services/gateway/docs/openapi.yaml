# Generated by backend/scripts/openapi.js from the routes and docs/endpoints.js.
# Do not edit by hand: change those and run `npm run docs` in backend/.
openapi: 3.1.0
info:
  title: cportal-lrfe API (through the gateway)
  version: 0.1.0
  description: >-
    Every endpoint the browser can reach, at its /api/... path. The gateway only forwards requests: each service checks the token and
    permissions itself. Service-only endpoints are listed too, but answer 401 to a user token.


    In development, `ng serve` proxies /api to the gateway (angular-app/proxy.conf.json), so the paths work from the app's origin as they
    are.
servers:
  - url: http://localhost:3500
    description: gateway (local development)
tags:
  - name: identity · Auth
    description: Sign-in, MFA, sessions. The refresh token is an httpOnly cookie `lrfe_rt` (path /api/auth), never visible to JavaScript.
  - name: identity · Roles
    description: The six fixed roles and their permissions.
  - name: identity · Users
    description: User administration (permission admin.users).
  - name: identity · Offices
    description: >-
      Office locations (registry offices and external bodies). Users other than system administrators belong to one. Offices are never
      deleted.
  - name: identity · Policies
    description: Security policies and segregation-of-duties rules.
  - name: edrms · Service
    description: Health and metadata.
  - name: edrms · Filing
    description: "Service-to-service writes. Browsers cannot call these: they need a service token."
  - name: edrms · Documents
    description: Filed documents of record, their versions and content.
  - name: bpm · Processes
    description: Process definitions and starting instances.
  - name: bpm · Instances
    description: Running and finished process instances.
  - name: bpm · Tasks
    description: The signed-in user's task inbox.
  - name: intake · Service
    description: Health, catalogue and AI cost.
  - name: intake · Capture
    description: Batches and uploads (permission capture.scan).
  - name: intake · Documents
    description: Captured documents and their extraction results.
  - name: intake · Review
    description: >-
      Field review (verify.edit) and filing or rejecting (verify.file). Changes claim the document for 30 minutes so two reviewers do not
      collide.
  - name: land-records · Service
    description: Health and metadata.
  - name: land-records · Records
    description: Land records, their versions and seal chain.
  - name: land-records · Documents
    description: Filed EDRMS documents, found for land records.
  - name: audit · Trail
    description: The audit trail and its hash chain.
  - name: audit · Proofs
    description: Proofs that an item is in a root anchored on Cardano, and checking them.
  - name: audit · Anchorings
    description: Every batch put on the blockchain, for every signed-in user.
  - name: audit · Sign-off
    description: Auditors' sign-offs and findings, with segregation of duties (sod2).
  - name: audit · Evidence
    description: "Evidence packs: a land record with everything needed to check it outside the portal."
  - name: extracts · Extracts
    description: The register of ownership extracts.
  - name: extracts · Public check
    description: Checking an extract from its QR code, with no sign-in (through the gateway's rate-limited /api/public).
  - name: gateway
    description: The gateway itself.
paths:
  /api/access-log:
    get:
      tags:
        - identity · Users
      summary: Admin access log
      description: |-
        Sign-ins, denials, user, role and policy changes, newest first. `{ items, total }`.

        **Access:** Signed-in user with permission `admin.users`.
      operationId: identity_getAccessLog
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - role
              - user
              - policy
              - denied
              - session
              - office
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - admin.users
  /api/audit/anchoring:
    post:
      tags:
        - audit · Proofs
      summary: The anchoring status of versions (land-records, edrms, extracts)
      description: >-
        Body `{ keys }`: up to 500 of `record-version:<id>:<n>` and `document-version:<id>:<n>`. `{ items: { <key>: { status, batch, tx,
        network, confirmedAt } | null } }`; null when the version is not in the tree.


        **Access:** Service token only, from: `land-records`, `edrms`, `extracts`. Browsers cannot call this.
      operationId: audit_postAuditAnchoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keys
              additionalProperties: false
              properties:
                keys:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    pattern: ^(record|document)-version:[0-9a-fA-F-]{36}:[1-9][0-9]{0,8}$
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - land-records
          - edrms
          - extracts
  /api/audit/anchoring/check:
    post:
      tags:
        - audit · Proofs
      summary: Check a land record version now, for the public check of an ownership extract (extracts)
      description: >-
        Body `{ recordId, version }`. The version checked as `POST /audit/verify` checks it, without the proof: `{ valid, status, checks: {
        item, path, chain }, seal, batch, tx, confirmedAt, explorerUrl, checkedAt }`; each check true, false or null (could not be made
        now). 404 when the version is not in the tree.


        **Access:** Service token only, from: `extracts`. Browsers cannot call this.
      operationId: audit_postAuditAnchoringCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordId
                - version
              additionalProperties: false
              properties:
                recordId:
                  type: string
                  format: uuid
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - extracts
  /api/audit/anchoring/health:
    get:
      tags:
        - audit · Anchorings
      summary: Whether anchoring is working (administrators)
      description: >-
        For `admin.policies` or `audit.view`. `{ configured, network, wallet: { readable, address, funds: { ada, low, minimumAda } }, chain:
        { reachable, tipHeight, synced }, lastAnchoring: { batch, status, createdAt }, next: { dueAt, waiting }, overdue, gaps: { count,
        latest: [{ seq, at, missing }] }, warnings, live }`. Each part is read on its own: when the blockchain or the wallet's key cannot be
        read, the report says so and the rest still comes back. `warnings`: `walletUnreadable`, `lowFunds`, `unreachable`, `catchingUp`,
        `overdue` (fingerprints wait and the last anchoring is more than two periods old), `trailGap`. `live`: the broadcast warnings
        `audit.wallet.low` and `audit.trail.gap` received in the last day (`kind` `lowFunds` or `trailGap`, `at`, `missing`).


        **Access:** Signed-in user with any of `admin.policies`, `audit.view`.
      operationId: audit_getAuditAnchoringHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        anyOf:
          - admin.policies
          - audit.view
  /api/audit/anchoring/proof:
    post:
      tags:
        - audit · Proofs
      summary: The proof of a land record version, for an ownership extract's PDF (extracts)
      description: >-
        Body `{ recordId, version }`. `{ proof, explorerUrl }`: the proof as `GET /audit/proofs/record-version/:id` gives it and the
        evidence pack holds it (`proofs/record-v<n>.json`), and the transaction's page on a public blockchain explorer (null while waiting).
        404 when the version is not in the tree.


        **Access:** Service token only, from: `extracts`. Browsers cannot call this.
      operationId: audit_postAuditAnchoringProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordId
                - version
              additionalProperties: false
              properties:
                recordId:
                  type: string
                  format: uuid
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - extracts
  /api/audit/anchoring/wallet:
    get:
      tags:
        - audit · Anchorings
      summary: The published anchoring wallet
      description: >-
        For checking a proof outside the portal (the offline verifier's `--address`). `{ address, explorerUrl, transactionUrl }`: the wallet
        that pays for every anchoring, its page on a public blockchain explorer, and the explorer's address for a transaction (append the
        transaction id); all null when no blockchain is configured. 503 while the wallet's key cannot be read. No sign-in.


        **Access:** Public: no token needed.
      operationId: audit_getAuditAnchoringWallet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /api/audit/anchors:
    get:
      tags:
        - audit · Anchorings
      summary: Every batch put on the blockchain, newest first
      description: >-
        `status`: `all` (the default), `progress` (sent or in a block, not confirmed yet) or `failed`; `limit` (up to 100) and `offset`. `{
        items, total, counts: { all, progress, failed }, confirmationsNeeded, next }`. Each item: `batch`, `createdAt`, `status` (`sent`,
        `onChain`, `confirmed`, `failed`), `covers` (the new fingerprints since the last batch before it that did not fail; null for a
        failed one), `txHash` and `explorerUrl` (a public blockchain explorer; null for a failed one), `block`, `confirmations`, `reason` (a
        failed one: `expired`, `rolledBackExpired` or `refused`), `replacedBy` (a failed one: the next batch) and `replaces` (the failed
        batch before it). `next`: `{ dueAt, waiting }`, when the next batch is due and how many fingerprints wait for it; null when no
        blockchain is configured. Every role holds `anchors.view`.


        **Access:** Signed-in user with permission `anchors.view`.
      operationId: audit_getAuditAnchors
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - progress
              - failed
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - anchors.view
  /api/audit/anchors/{batch}:
    get:
      tags:
        - audit · Anchorings
      summary: One batch
      description: >-
        As in the list, with what is on the blockchain: `root`, `size`, `prev` (`{ root, batch }`: the previous batch's root and the batch
        it belongs to); `steps` (`createdAt`, `sentAt`, `sends`, `onChainAt`, `confirmedAt`, `failedAt`); for a failed one the `replacement`
        (`batch`, `status`, `createdAt`); `previousBatch` and `nextBatch`. 404 for an unknown batch.


        **Access:** Signed-in user with permission `anchors.view`.
      operationId: audit_getAuditAnchorsBatch
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - anchors.view
  /api/audit/anchors/{batch}/coverage:
    get:
      tags:
        - audit · Anchorings
      summary: What one batch covers
      description: >-
        The fingerprints the batch put on the blockchain for the first time (since the last batch before it that did not fail) and the audit
        sign-offs in the trail up to its checkpoint. `{ batch, kinds: { recordVersions, documentVersions, signoffs }, trailUpTo, records,
        total }`. `records`: the land records with a version or an audit sign-off in the batch, by record number, paged (`limit` up to 100,
        `offset`), each with `recordId`, `recordNo`, `label`, `versions` and `signoffs` (`[{ from, to }]`). Each version comes with what its
        fingerprint stands for: `documents` (how many it is made of), `documentsEarlier` (how many of those reached the blockchain in
        earlier batches) and `versionsBefore` (chained through the previous version's seal). A failed batch covers nothing; 404 for an
        unknown batch.


        **Access:** Signed-in user with permission `anchors.view`.
      operationId: audit_getAuditAnchorsBatchCoverage
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - anchors.view
  /api/audit/anchors/{batch}/documents:
    get:
      tags:
        - audit · Anchorings
      summary: The document versions one batch put on the blockchain
      description: >-
        In the order they were sealed, paged (`limit` up to 100, `offset`): `{ batch, items, total }`, each item `documentId`, `version`,
        `edrmsNo`, `docType` and `ref` (the deed or instrument number; from its filing or correction in the trail, null for a document
        sealed before the audit service) and `usedIn`: the land record versions in the same batch made of it (`recordId`, `versionNumber`,
        `recordNo`, `label`). A failed batch has none; 404 for an unknown batch.


        **Access:** Signed-in user with permission `anchors.view`.
      operationId: audit_getAuditAnchorsBatchDocuments
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
