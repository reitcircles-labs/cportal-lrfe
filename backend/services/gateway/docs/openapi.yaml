  /api/documents/{id}/amendments:
    post:
      tags:
        - edrms · Filing
      summary: Apply an approved amendment (bpm only)
      description: >-
        Creates a new sealed version; the previous one is kept. Users request changes through bpm: POST
        /processes/document-amendment/instances. The approver must differ from the requester. Returns `{ document, version }`.


        **Access:** Service token only, from: `bpm`. Browsers cannot call this.
      operationId: edrms_postDocumentsIdAmendments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
                - expectedVersion
                - actor
                - approvedBy
              properties:
                reason:
                  type: string
                expectedVersion:
                  type: integer
                  minimum: 1
                changes:
                  type: array
                  items:
                    type: object
                    required:
                      - k
                      - v
                    properties:
                      k:
                        type: string
                      v:
                        type: string
                recordMetadata:
                  type: object
                actor:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: string
                      minLength: 1
                    name:
                      type: string
                approvedBy:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: string
                      minLength: 1
                    name:
                      type: string
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - bpm
