  /api/public/extracts/{token}:
    get:
      tags:
        - extracts · Public check
      summary: Check an extract by its token, from its QR code
      description: >-
        One state, always 200 and always the same fields (null where they do not apply): `{ state, extractId, extractNo, recordNo,
        versionNumber, issuedAt, pdfSha256, fingerprintEnd, batch, transactionId, explorerUrl, replacedAt, revokedAt, checkedAt, timeZone
        }`. `state`: `current` (the version's seal, held by land-records, is in a confirmed batch on the blockchain and the version is the
        record's current one), `replaced` (the same, but the record has a newer version: `replacedAt` is when the version after the
        extract's was committed), `revoked` (withdrawn on `revokedAt`; the reason is not given), `mismatch` (a check failed), `unknown` (no
        such extract; every other field null) or `unavailable` (it cannot be checked right now). `fingerprintEnd` is the last 8 characters
        of the version's seal; `pdfSha256` the SHA-256 of the PDF as issued, to compare a file with. `timeZone` (every state) is the IANA
        time zone the extract prints its dates in, e.g. `Africa/Windhoek`, so the check page shows the same times. Never the owners, their
        ID numbers or shares, or the parcel.


        **Access:** Public: no token needed.
      operationId: extracts_getPublicExtractsToken
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /api/public/extracts/seal:
    get:
      tags:
        - extracts · Public check
      summary: The registry's seal certificate, to compare an extract's seal with
      description: >-
        `{ subject, sha256, validFrom, validTo }`: `sha256` is the SHA-256 of the seal certificate (DER), lowercase hex, the fingerprint the
        offline verifier takes (`node lrfe-verify.mjs extract.pdf --address <wallet> --seal <sha256>`). An extract sealed with another
        certificate, even one with the same name, is not valid. 503 when no seal is set up.


        **Access:** Public: no token needed.
      operationId: extracts_getPublicExtractsSeal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
