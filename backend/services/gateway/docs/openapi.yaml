      security:
        - bearerAuth: []
      x-access:
        allOf:
          - anchors.view
  /api/audit/anchors/lookup:
    get:
      tags:
        - audit · Anchorings
      summary: Is it on the blockchain? Find a land record or document
      description: >-
        `q`: a land record number (`LR-NA-2026-000001`), a document number (`EDR-NA-2026-000412`), a deed or instrument number (`T
        2210/2008`), or words (an Erf, a township). Numbers match exactly; words match land records with a committed version, on their
        number and parcel only (never owners). `{ query, kind }`, `kind` one of: `record` (with `record`, `answer`, `history`), `document`
        (with `document`, `answer`, `history`), `choices` (several land records matched the words: `choices: [{ recordId, recordNo, label
        }]`, at most 20) or `none`. `answer` is for the current version, whose seal stands for everything before it: `{ status: "yes",
        version, batch }` (in a block or confirmed), `{ status: "sent", version, batch }`, `{ status: "waiting", version, nextDueAt }`, or
        `{ status: "notRecorded", version }` (no fingerprint recorded: no committed version yet, or not in the audit tree). `history`,
        newest first: each item with `at`, `status` (`waiting`, `sent`, `onChain`, `confirmed`, `notRecorded`) and `batch`; for a land
        record `version` items (`versionNumber`), `document` items (the documents its versions are made of: `documentId`, `version`,
        `edrmsNo`, `docType`, `ref`) and `signoff` items (`from`, `to`); for a document its `document` versions and `usedIn` items (the
        committed land record versions made of it: `recordId`, `recordNo`, `label`, `versionNumber`, `documentVersion`). 30 searches a
        minute per user (429 after).


        **Access:** Signed-in user with permission `anchors.view`.
      operationId: audit_getAuditAnchorsLookup
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - anchors.view
  /api/audit/findings:
    post:
      tags:
        - audit · Sign-off
      summary: Raise a finding
      description: >-
        Body `{ recordId, version, documentId?, description }` (a land record version, or a document version in it) or `{ documentId,
        version, description }` (a document version). On the current version (409 for a replaced one). The records officers and the
        registrars get a task in their inbox (bpm process `audit-finding`); 503 when bpm cannot be reached (the finding is not raised). 201
        with the finding (`status: "open"`, `instanceId`). A trail entry (`audit.finding.raised`).


        **Access:** Signed-in user with permission `audit.signoff`.
      operationId: audit_postAuditFindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - description
              additionalProperties: false
              properties:
                recordId:
                  type: string
                  format: uuid
                version:
                  type: integer
                  minimum: 1
                documentId:
                  type: string
                  format: uuid
                description:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - audit.signoff
    get:
      tags:
        - audit · Sign-off
      summary: Findings of a land record or document
      description: >-
        `{ items }`, oldest first; filter by `recordId`, `documentId`, `status` (`open`, `resolved`, `closed`). For auditors and the records
        desk.


        **Access:** Signed-in user with any of `audit.view`, `record.view`.
      operationId: audit_getAuditFindings
      parameters:
        - name: recordId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: documentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - resolved
              - closed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        anyOf:
          - audit.view
          - record.view
  /api/audit/findings/{id}:
    get:
      tags:
        - audit · Sign-off
      summary: One finding
      description: >-
        With `status`, `answers`, and `resolvedByVersion` (a newer reviewed version resolved it) or `outcome`, `closedByName`, `closeReason`
        (the closing answer), `closedAt`.


        **Access:** Signed-in user with any of `audit.view`, `record.view`.
      operationId: audit_getAuditFindingsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
