  /api/intake/batches:
    get:
      tags:
        - intake · Capture
      summary: All batches with document counts per status
      description: "**Access:** Signed-in user with any of `capture.view`, `verify.view`."
      operationId: intake_getBatches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
    post:
      tags:
        - intake · Capture
      summary: Create a batch
      description: |-
        Optional `{ source }`, e.g. "Vault 3 · T-series vol. 2008". Ids are given out in order: WDH-B001, WDH-B002, …

        **Access:** Signed-in user with permission `capture.scan`.
      operationId: intake_postBatches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: OK
