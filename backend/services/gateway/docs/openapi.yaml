  /api/extracts:
    post:
      tags:
        - extracts · Extracts
      summary: Issue an extract of a land record's current version for an owner
      description: >-
        `{ recordId, versionNumber, ownerIndex, idNo, documentSeen }`: the owner chosen on the current version, the ID number typed from the
        identity document shown, and `documentSeen: true`. 201 with the register row: `id`, `recordId`, `recordNo`, `versionNumber`,
        `issuedById`, `issuedByName`, `ownerIndex`, `ownerName`, `ownerIdLast4` (the last four characters of the owner's ID number; the rest
        is not kept), `documentSeen`, `issuedAt`, `token` (random, for the public check), `status` `valid`, `pdfSha256` (the SHA-256 of the
        sealed PDF, also in the issued event), `isCurrentVersion`. The extract's PDF, sealed by the registry with the version's proof
        attached, is made and stored first; `GET /extracts/{id}/pdf` gives it. 400 without `documentSeen: true`. 409 when the record has no
        approved version, `versionNumber` is no longer the current one, there is no such owner, the ID number does not match the owner's on
        the version, or the version is not on the blockchain yet (its anchoring confirmed); 503 when that cannot be checked, the proof
        cannot be read, or the registry's seal is not set up or cannot be applied now; 404 when there is no such record.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: extracts_postExtracts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - recordId
                - versionNumber
                - ownerIndex
                - idNo
                - documentSeen
              properties:
                recordId:
                  type: string
                  format: uuid
                versionNumber:
                  type: integer
                  minimum: 1
                ownerIndex:
                  type: integer
                  minimum: 0
                idNo:
                  type: string
                  minLength: 1
                  maxLength: 40
                documentSeen:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
