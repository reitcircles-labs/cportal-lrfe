  /api/documents:
    post:
      tags:
        - edrms · Filing
      summary: File a document (intake only)
      description: >-
        multipart/form-data with a `meta` JSON field FIRST, then `file`. 201 `{ document, created: true }`, or 200 `{ document, created:
        false }` when the same source was already filed.


        **Access:** Service token only, from: `intake`. Browsers cannot call this.
      operationId: edrms_postDocuments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - meta
                - transcription
                - file
              properties:
                meta:
                  type: string
                  description: "JSON: document type, fields, provenance (at most 64 kB)… (must come before the file)"
                transcription:
                  type: string
                  description: "optional JSON: the AI's page text `[{ page, text }]`, stored encrypted beside the file (before the file)"
                file:
                  type: string
                  format: binary
                  description: the scanned file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
