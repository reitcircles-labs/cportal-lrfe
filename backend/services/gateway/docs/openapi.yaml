      summary: Invite a user
      description: >-
        Body `{ name, email, roles, officeId }`: an active office (required unless the roles include System administrator). Creates the user
        as Invited and emails them the activation link (valid 3 days). Returns `{ user, email: { sent, to, reason? }, inviteUrl? }`: the
        user is created even when the email fails, and `reason` says why. `inviteUrl` is only returned when
        IDENTITY_EXPOSE_INVITE_LINKS=true (dev).


        **Access:** Signed-in user with permission `admin.users`.
      operationId: identity_postUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - email
                - roles
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                email:
                  type: string
                  format: email
                  maxLength: 320
                officeId:
                  type:
                    - string
                    - "null"
                  format: uuid
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - sup
                      - scan
                      - rev
                      - rec
                      - aud
                      - adm
