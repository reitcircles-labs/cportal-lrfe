      tags:
        - identity · Auth
      summary: "Second step: the 6-digit authenticator code"
      description: >-
        Takes the `challenge` from /auth/login. On first use this also enrols the authenticator. Returns `{ accessToken, expiresIn, me }`
        and sets the refresh cookie.


        **Access:** Public: no token needed.
      operationId: identity_postAuthMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challenge
                - code
              properties:
                challenge:
                  type: string
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /api/auth/refresh:
    post:
      tags:
        - identity · Auth
      summary: New access token from the refresh cookie
      description: |-
        Rotates the refresh cookie. 401 when the session ended (idle timeout, sign-out, suspension, replayed token).

        **Access:** Uses the httpOnly refresh cookie `lrfe_rt` (sent automatically by the browser to /api/auth).
      operationId: identity_postAuthRefresh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - refreshCookie: []
  /api/catalogue:
    get:
      tags:
        - identity · Roles
      summary: Permission catalogue
      description: |-
        `{ groups, perms, roles }`: permission groups, every permission with its label, and the roles.

        **Access:** Any signed-in user.
      operationId: identity_getCatalogue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
