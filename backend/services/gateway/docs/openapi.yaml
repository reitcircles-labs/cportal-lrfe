  /api/document-content/{id}/{n}:
    get:
      tags:
        - edrms · Documents
      summary: File content behind a signed link (local/memory storage)
      description: |-
        Use the `url` from GET /documents/{id}/content; `exp` and `sig` authorise it. 404 when expired or tampered with.

        **Access:** No token: the `exp` and `sig` of a signed link authorise it.
      operationId: edrms_getContentIdN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: exp
          in: query
          required: true
          schema:
            type: integer
        - name: sig
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /api/documents:
    post:
      tags:
        - edrms · Filing
      summary: File a document (intake only)
      description: >-
        multipart/form-data with a `meta` JSON field FIRST, then `file`. 201 `{ document, created: true }`, or 200 `{ document, created:
        false }` when the same source was already filed.


        **Access:** Service token only, from: `intake`. Browsers cannot call this.
      operationId: edrms_postDocuments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - meta
                - file
              properties:
                meta:
                  type: string
                  description: "JSON: document type, fields, provenance… (must come before the file)"
                file:
                  type: string
                  format: binary
                  description: the scanned file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - intake
    get:
      tags:
        - edrms · Documents
      summary: Search filed documents
      description: >-
        `{ items, total }`. `q` searches numbers, references and field values. Filter on any extracted field with `field.<key>=<value>`,
        e.g. `field.property=Erf 1873, Klein Windhoek`.


        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: edrms_getDocuments
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: docType
          in: query
          required: false
          schema:
            type: string
            enum:
              - deed_of_transfer
              - deed_of_sale
              - deed_of_grant
              - sg_diagram
              - mortgage_bond
              - other
        - name: batchId
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
