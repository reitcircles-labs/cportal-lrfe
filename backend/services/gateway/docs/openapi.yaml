      summary: Document types and record-metadata fields
      description: |-
        `{ docTypes, recordMetadataFields }`.

        **Access:** Any signed-in user.
      operationId: edrms_getCatalogue
      responses:
        "200":
          description: OK
          content:
            application/json:
