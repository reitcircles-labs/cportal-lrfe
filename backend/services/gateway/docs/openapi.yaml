        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - intake
    get:
      tags:
        - edrms · Documents
      summary: Search documents
      description: >-
        `{ items, total, totalCapped? }`. `q` searches numbers, references and field values. Filter on any extracted field with
        `field.<key>=<value>`, e.g. `field.property=Erf 1873, Klein Windhoek`. Each item has `status`: `filed`, or `intake` for a document
        still in intake (only with `EDRMS_SEARCH=opensearch`, and only for a user with intake's read permission, or for land-records with
        `intake=true` on such a user's behalf): `{ id (intake's), status, intakeStatus, docType, instrumentRef, party, props.property,
        fields }`. Through the index a total above 1,000 is given as 1000 with `totalCapped: true` (more than that); when the index cannot
        answer, 503.


        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: edrms_getDocuments
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: docType
          in: query
          required: false
          schema:
            type: string
            enum:
              - deed_of_transfer
              - deed_of_sale
              - deed_of_grant
              - sg_diagram
              - mortgage_bond
              - other
        - name: batchId
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: intake
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
