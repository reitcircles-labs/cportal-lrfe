    get:
      tags:
        - edrms · Documents
      summary: Integrity check of a version
      description: |-
        Recomputes the SHA-256 of the stored file and checks the seal: `{ intact, contentIntact, sealIntact, version, checkedAt, … }`.

        **Access:** Signed-in user with permission `audit.view`.
      operationId: edrms_getDocumentsIdVersionsNVerify
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
