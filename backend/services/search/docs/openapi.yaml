# Generated by backend/scripts/openapi.js from the routes and docs/endpoints.js.
# Do not edit by hand: change those and run `npm run docs` in backend/.
openapi: 3.1.0
info:
  title: search service
  version: 0.1.0
  description: >-
    Document search: receives intake’s and edrms’ document events and fetches each document for the search index. Reached on the internal
    network only, not through the gateway. Design: services/search/README.md.


    Paths here are the service's own, on port 3508. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3508
    description: search directly (local development)
tags:
  - name: Service
    description: Health and the event consumers’ lag.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /health/events:
    get:
      tags:
        - Service
      summary: "The event consumers: counts and lag"
      description: >-
        `{ lag, consumers: [{ event, durable, received, fetched, missing, failed, lastHandledAt, pending, unacked }] }`. Counts since the
        service started; `pending` (not given to the service yet) and `unacked` (being handled) come from the event stream, `lag` is their
        total, null when the event bus cannot say. No document content.


        **Access:** Public: no token needed.
      operationId: getHealthEvents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/auth/login or /api/auth/mfa (15 minutes; renew with POST /api/auth/refresh).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token (typ "service"), signed with the shared JWT_SECRET. Not available to browsers.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lrfe_rt
      description: httpOnly refresh cookie, path /api/auth, set at sign-in.
  schemas:
    Error:
      type: object
      required:
        - status
        - message
        - timestamp
        - path
      properties:
        status:
          type: string
          example: Forbidden
          description: HTTP status text
        message:
          type: string
          example: Not permitted
        details:
          description: Extra data on some errors, e.g. `{ perm }` on 403, `{ blockers }` when a document cannot be filed yet
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /users
