openapi: 3.1.0
info:
  title: bpm service
  version: 0.1.0
  description: >-
    Workflow engine: process definitions, running instances, and the task inbox with four-eyes approvals. Who may start a process, or do or
    approve a task, is set per process definition and checked by the engine (403 otherwise).


    Paths here are the service's own, on port 3503. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3503
    description: bpm directly (local development)
tags:
  - name: Processes
    description: Process definitions and starting instances.
  - name: Instances
    description: Running and finished process instances.
  - name: Tasks
    description: The signed-in user's task inbox.
  - name: Service
    description: Health.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /processes:
    get:
      tags:
        - Processes
      summary: Deployed process definitions
      description: |-
        `{ processes: [{ key, name, version, description, start, variables }] }`.

        **Access:** Any signed-in user.
      operationId: getProcesses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/processes
  /processes/{key}/instances:
    post:
      tags:
        - Processes
      summary: Start a process
      description: >-
        Body `{ variables }`, as the definition describes. E.g. request a correction to a filed document: key `document-amendment`,
        variables `{ documentId, expectedVersion, reason, changes: [{ k, v }] }`. The definition says which permissions or services may
        start it.


        **Access:** Signed-in user, or a service token.
      operationId: postProcessesKeyInstances
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9-]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variables
              properties:
                variables:
                  type: object
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-gateway-path: /api/processes/{key}/instances
  /instances:
    get:
      tags:
        - Instances
      summary: List instances
      description: |-
        `{ items, total }`. `mine=true`: only those you started.

        **Access:** Any signed-in user.
      operationId: getInstances
      parameters:
        - name: definitionKey
          in: query
          required: false
          schema:
            type: string
        - name: businessKey
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - error
              - completed
              - cancelled
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/process-instances
  /instances/{id}:
