openapi: 3.1.0
info:
  title: intake service
  version: 0.1.0
  description: >-
    Capture of scans into batches, AI extraction of their metadata as proposals, field-by-field review against evidence and checks, and
    filing of the verified values into the EDRMS. Document status: queued → extracting → ready (in review) → filed, or failed (retry) /
    rejected.


    Paths here are the service's own, on port 3504. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3504
    description: intake directly (local development)
tags:
  - name: Capture
    description: Batches and uploads (permission capture.scan).
  - name: Documents
    description: Captured documents and their extraction results.
  - name: Review
    description: >-
      Field review (verify.edit) and filing or rejecting (verify.file). Changes claim the document for 30 minutes so two reviewers do not
      collide.
  - name: Service
    description: Health, catalogue and AI cost.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
      x-gateway-path: /api/intake/health
