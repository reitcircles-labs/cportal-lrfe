openapi: 3.1.0
info:
  title: shipping-records service
  version: 0.1.0
  description: >-
    Shipping records: draft bills of lading (B/Ls) of an organisation, versioned, reviewed by a second person before each version is
    committed, and sealed. Answers the record contract for the shared services. A user sees only the B/Ls of their own organisation. Design:
    services/shipping-records/README.md.


    Paths here are the service's own, on port 3509. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3509
    description: shipping-records directly (local development)
tags:
  - name: Records
    description: Bills of lading, their versions and seal chain.
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /records:
    post:
      tags:
        - Records
      summary: Create a draft B/L (version 1) for your organisation
      description: >-
        `{ format, document, partyOrganisations? }`. `format` names a B/L format that is on in this install (`LRFE_BL_FORMATS`, `dcsa-3.0`
        by default); `document` is the B/L in that format, converted to the internal model (its status is left out). `partyOrganisations`
        links parties of the document to organisations (`shipper`, `notifyParties.0`). 400 with `details.problems` (every problem, `{ path,
        message }`) when the B/L is not valid, or for a format that is unknown or not on. 409 when your organisation already has a B/L with
        the same carrier code and transport document reference (another organisation may draft the same reference; neither sees the other
        one). 403 for a user of no organisation. Answers the record as `GET /records/{id}` does.


        **Access:** Signed-in user with permission `bl.draft`.
      operationId: postRecords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - format
                - document
              properties:
                format:
                  type: string
                  minLength: 1
                  maxLength: 50
                document:
                  type: object
                partyOrganisations:
                  type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - bl.draft
    get:
      tags:
        - Records
      summary: List your organisation's B/Ls
      description: >-
        `{ items, total }`, newest first. Each item: `id`, `recordNo` (the transport document reference), `carrierCode`, `label`,
        `organisationId`, `status` (`draft`: never committed; `committed`), `currentVersion`, `draftVersion`, `draftState` (`draft` or
        `in_review`). `status` filters by `draft`, `committed` or `in_review` (a draft waits for review); `q` searches the reference and the
        label. The audit service sees every organisation's B/Ls.


        **Access:** Signed-in user with permission `bl.read`, or a service token from `audit`.
      operationId: getRecords
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - committed
              - in_review
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        allOf:
          - bl.read
        services:
          - audit
  /records/{id}/draft:
    put:
      tags:
        - Records
      summary: Replace the open draft's B/L, or open a new draft version
      description: >-
        `{ format, document, partyOrganisations? }`, as for creating. Replaces the data of the open draft; when the B/L has none (its last
        version was committed), opens the next version as a draft. The carrier code and the transport document reference never change (400).
        409 while the draft is in review, or when it was changed or submitted meanwhile (reload and try again).


        **Access:** Signed-in user with permission `bl.draft`.
      operationId: putRecordsIdDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
