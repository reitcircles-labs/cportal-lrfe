        `data` is the B/L `{ schemaVersion, document, partyOrganisations? }`; `documentHash` its canonical SHA-256; `seal` and
        `previousSeal` once committed.


        **Access:** Signed-in user with permission `bl.read`, or a service token from `audit`, `extracts`.
      operationId: getRecordsIdVersionsN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        allOf:
          - bl.read
        services:
          - audit
          - extracts
  /records/{id}/verify:
    get:
      tags:
        - Records
      summary: Recompute the seal chain of the committed versions (audit service only)
      description: >-
        `{ recordId, recordNo, intact, versions: [{ versionNumber, seal, intact, linked }], checkedAt }`. `intact`: the seal matches the
        version; `linked`: it includes the previous version's seal.


        **Access:** Service token only, from: `audit`. Browsers cannot call this.
      operationId: getRecordsIdVerify
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - audit
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/auth/login or /api/auth/mfa (15 minutes; renew with POST /api/auth/refresh).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token (typ "service"), signed with the shared JWT_SECRET. Not available to browsers.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lrfe_rt
      description: httpOnly refresh cookie, path /api/auth, set at sign-in.
  schemas:
    Error:
      type: object
      required:
        - status
        - message
        - timestamp
        - path
      properties:
        status:
          type: string
          example: Forbidden
          description: HTTP status text
        message:
          type: string
          example: Not permitted
        details:
          description: Extra data on some errors, e.g. `{ perm }` on 403, `{ blockers }` when a document cannot be filed yet
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /users
