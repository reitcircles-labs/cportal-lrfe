        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - bl.draft
  /records/{id}/versions/{n}/commit:
    post:
      tags:
        - Records
      summary: Commit an approved version (bpm only)
      description: >-
        `{ by, comment }`. Seals the version, chains it to the previous committed version and makes it current. `by` must not be the
        submitter (403). 409 when the version is not in review. Repeating it by the same person is harmless.


        **Access:** Service token only, from: `bpm`. Browsers cannot call this.
      operationId: postRecordsIdVersionsNCommit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - by
              properties:
                by:
                  type: object
                  required:
                    - id
                  properties:
                    id:
                      type: string
                      minLength: 1
                    name:
                      type: string
                comment:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
