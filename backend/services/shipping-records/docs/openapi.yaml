        included when `split` is allowed. `title`: `{ kind, state, carrier, holder, endorsement, consignee, returnTo, issuedVersion,
        documentHash, revision, createdAt, updatedAt }`, null before issue. `allowedCommands`: the commands your organisation may run on it
        now (before issue: `issue` for the carrier that owns a B/L with a committed version and none in review). `chain`: the chain-of-title
        entries, signed, oldest first; `[]` before issue. `splitFrom`: `{ recordId, recordNo }` of the B/L it was split from, only for a B/L
        made by a split; `splitInto`: `[{ recordId, recordNo }]` of the B/Ls it was split into, by number, only once split (numbers only,
        never their documents). Before issue only the organisation that owns the B/L sees it; after it the carrier, the current holder, past
