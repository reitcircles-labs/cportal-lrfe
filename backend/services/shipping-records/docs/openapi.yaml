      description: >-
        `{ items, total, organisationNames, ports }`, newest first; `limit` (1 to 200, 50 by default) and `offset` page it. The B/Ls your
        session's organisation sees with `GET /records/{id}/title`: before issue the ones it owns (its drafts, in review or committed),
        after it those of which it is the carrier, the current holder, a past holder or the consignee. Never another organisation's B/L; the
        organisation is never taken from the request. `number` (CB-47, up to 100 characters): only the B/Ls of that number (the whole
        transport document reference, whatever its case and the spaces around it; two carriers may use the same one); another organisation's
        B/L of that number is never found, so the answer is the same as for a number nobody uses; 400 for a blank number. Each item: the
        fields of `GET /records` (`id`, `recordNo`, `carrierCode`, `label`, `status`, `draftState`, ...), latest `portOfLoading`,
        `portOfDischarge`, `shipper`, `shipperName`, `consignee`, `consigneeName`, `draftKind` (CB-72), `title` (`{ kind, state, carrier,
        holder, endorsement, consignee, updatedAt }`, null before issue) and `roles`, your organisation's roles on it (`carrier`, `holder`,
        `past-holder`, `consignee`; the carrier is never its own past holder). `organisationNames`: `{ id: name }` of the organisations the
        items name (owner, carrier, holder, shipper, consignee), as identity gives them; one it gives no name for, or every one while
        identity cannot answer, is left out (show its id): the list never fails for a name. `ports`: `{ code: { code, name, country } }` of
