  /records/{id}/title/{command}:
    post:
      tags:
        - Records
      summary: >-
        Run a title command on a B/L: issue, void, endorse, transfer, surrender, release, deliver, surrender-for-amendment, amend, split,
        switch-to-paper
      description: >-
        Body `{ to?, inBlank?, confirmBearer?, format?, document?, partyOrganisations?, children? }` (anything else is ignored): `to` the
        organisation that receives the B/L (endorse, transfer), `inBlank` whether an endorsement is in blank, `confirmBearer` the
        confirmation to switch a blank-endorsed B/L to paper; for `amend` the new document `{ format, document, partyOrganisations? }` (same
        carrier code and reference, still to order; committed by the engine as the next version; 400 `different-reference`, `kind-changed`
        or its problems; 409 `draft-open` while a version is being drafted or in review); for `split` `children: [{ format, document,
        partyOrganisations? }]` (at least two, each a B/L to order of the same carrier code with its own reference; their cargo adds up to
        the B/L's: 400 `cargo-mismatch`, `child-reference`; 409 for a reference the carrier already has, 409 `draft-open` while a version of
        the B/L is being drafted or in review), answered with `children: [{ recordId, recordNo }]` too. A `release` naming part of the cargo
        is refused (400 `partial-release`). The command runs as your session's organisation. `issue`, `void`, `release`, `deliver`, `amend`
        and `split` need `bl.issue` (the carrier's staff); `endorse`, `transfer`, `surrender`, `surrender-for-amendment` and
        `switch-to-paper` need `bl.endorse` (the holder's). Issue binds the B/L's current committed version; the kind, the shipper (first
        holder) and the consignee come from it. The shipper on issue and `to` on endorse and transfer must be organisations registered and
        active on the platform (422 `unregistered-organisation`; 503 while that cannot be checked). Answers the title as `GET
        /records/{id}/title` does. Refusals, with the reason and `details.code` (the rules: backend/domains/shipping/docs/title-states.md):
        404 "B/L not found" for an organisation that does not see the B/L, before any other refusal; 400 for an unknown command
        (`unknown-command`) or a wrong argument; 403 when your organisation may not run it (`not-carrier`, `not-holder`) or for a user of no
        organisation; 409 for the kind, the state, a module that is off, a B/L without a committed version or with one in review, or a B/L
        changed meanwhile (`changed-meanwhile`, read it again); 503 while the platform signature is not set up. A refused command changes
        nothing and puts nothing on the trail.


        **Access:** Signed-in user with any of `bl.issue`, `bl.endorse`.
      operationId: postRecordsIdTitleCommand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: command
          in: path
          required: true
          schema:
            type: string
            maxLength: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  minLength: 1
                  maxLength: 100
                inBlank:
                  type: boolean
                confirmBearer:
                  type: boolean
                format:
                  type: string
                  minLength: 1
                  maxLength: 50
                document:
                  type: object
                partyOrganisations:
                  type: object
                children:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - format
                      - document
                    properties:
                      format:
                        type: string
                        minLength: 1
                        maxLength: 50
                      document:
                        type: object
                      partyOrganisations:
                        type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
