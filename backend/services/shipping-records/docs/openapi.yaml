        - Records
      summary: Submit the open draft for review
      description: >-
        The draft is frozen in review, with you as its submitter, until a second person commits it or sends it back. 409 when version `n` is
        not the open draft, or when it was changed meanwhile.


        **Access:** Signed-in user with permission `bl.draft`.
      operationId: postRecordsIdVersionsNSubmit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
