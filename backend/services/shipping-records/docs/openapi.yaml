        - serviceToken: []
      x-access:
        services:
          - bpm
  /records/{id}/versions/{n}/reject:
    post:
      tags:
        - Records
      summary: Send a version in review back as a draft (bpm only)
      description: |-
        `{ by, comment }`; the comment is required (400). The version becomes a draft again with the comment.

        **Access:** Service token only, from: `bpm`. Browsers cannot call this.
      operationId: postRecordsIdVersionsNReject
