openapi: 3.1.0
info:
  title: extracts service
  version: 0.1.0
  description: >-
    Ownership extracts: the register of extracts issued for an owner on a land record's current approved version once it is on the
    blockchain, each valid or revoked. Design: services/extracts/README.md.


    Paths here are the service's own, on port 3507. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3507
    description: extracts directly (local development)
tags:
  - name: Extracts
    description: The register of ownership extracts.
  - name: Public check
    description: Checking an extract from its QR code, with no sign-in (through the gateway's rate-limited /api/public).
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /extracts:
    post:
      tags:
        - Extracts
      summary: Issue an extract of a land record's current version for an owner
      description: >-
        `{ recordId, versionNumber, ownerIndex, idNo, documentSeen }`: the owner chosen on the current version, the ID number typed from the
        identity document shown, and `documentSeen: true`. 201 with the register row: `id`, `recordId`, `recordNo`, `versionNumber`,
        `issuedById`, `issuedByName`, `ownerIndex`, `ownerName`, `ownerIdLast4` (the last four characters of the owner's ID number; the rest
        is not kept), `documentSeen`, `issuedAt`, `token` (random, for the public check), `status` `valid`, `pdfSha256` (the SHA-256 of the
        sealed PDF, also in the issued event), `isCurrentVersion`. The extract's PDF, sealed by the registry with the version's proof
        attached, is made and stored first; `GET /extracts/{id}/pdf` gives it. 400 without `documentSeen: true`. 409 when the record has no
        approved version, `versionNumber` is no longer the current one, there is no such owner, the ID number does not match the owner's on
        the version, or the version is not on the blockchain yet (its anchoring confirmed); 503 when that cannot be checked, the proof
        cannot be read, or the registry's seal is not set up or cannot be applied now; 404 when there is no such record.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: postExtracts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - recordId
                - versionNumber
                - ownerIndex
                - idNo
                - documentSeen
              properties:
                recordId:
                  type: string
                  format: uuid
                versionNumber:
                  type: integer
                  minimum: 1
                ownerIndex:
                  type: integer
                  minimum: 0
                idNo:
                  type: string
                  minLength: 1
                  maxLength: 40
                documentSeen:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts
    get:
      tags:
        - Extracts
      summary: The extracts of a land record, newest first
      description: >-
        `{ items }`: the register rows of `recordId`, valid and revoked (`revokedAt`, `revokedByName`, `revokeReason`), each with
        `isCurrentVersion`: its version is still the record's current one.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: getExtracts
      parameters:
        - name: recordId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts
  /extracts/{id}/pdf:
    get:
      tags:
        - Extracts
      summary: "Download an extract again: its sealed PDF as issued"
      description: >-
        `application/pdf`, as an attachment: the exact bytes issued, checked against `pdfSha256` in the register. The PDF carries the
        registry's electronic seal (a PAdES signature) and, attached inside, the version's proof (`record-v<n>.proof.json`). 409 when the
        extract is revoked; 404 when there is no such extract.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: getExtractsIdPdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts/{id}/pdf
  /extracts/{id}/revoke:
    post:
      tags:
        - Extracts
      summary: Revoke an extract, with the reason
      description: >-
        `{ reason }`. The updated register row, `status` `revoked`; it stays in the register. 409 when it is already revoked.
        `isCurrentVersion` is null when the land record cannot be read just after the revocation is saved.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: postExtractsIdRevoke
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts/{id}/revoke
  /public/extracts/seal:
    get:
      tags:
        - Public check
      summary: The registry's seal certificate, to compare an extract's seal with
      description: >-
        `{ subject, sha256, validFrom, validTo }`: `sha256` is the SHA-256 of the seal certificate (DER), lowercase hex, the fingerprint the
        offline verifier takes (`node lrfe-verify.mjs extract.pdf --address <wallet> --seal <sha256>`). An extract sealed with another
        certificate, even one with the same name, is not valid. 503 when no seal is set up.


        **Access:** Public: no token needed.
      operationId: getPublicExtractsSeal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
      x-gateway-path: /api/public/extracts/seal
  /public/extracts/{token}:
    get:
      tags:
        - Public check
      summary: Check an extract by its token, from its QR code
      description: >-
        One state, always 200 and always the same fields (null where they do not apply): `{ state, extractId, recordNo, versionNumber,
        issuedAt, fingerprintEnd, batch, transactionId, explorerUrl, replacedAt, revokedAt, checkedAt }`. `state`: `current` (the version's
        seal, held by land-records, is in a confirmed batch on the blockchain and the version is the record's current one), `replaced` (the
        same, but the record has a newer version: `replacedAt` is when the version after the extract's was committed), `revoked` (withdrawn
        on `revokedAt`; the reason is not given), `mismatch` (a check failed), `unknown` (no such extract; every other field null) or
        `unavailable` (it cannot be checked right now). `fingerprintEnd` is the last 8 characters of the version's seal. Never the owners,
        their ID numbers or shares, or the parcel.


        **Access:** Public: no token needed.
      operationId: getPublicExtractsToken
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      x-gateway-path: /api/public/extracts/{token}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/auth/login or /api/auth/mfa (15 minutes; renew with POST /api/auth/refresh).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token (typ "service"), signed with the shared JWT_SECRET. Not available to browsers.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lrfe_rt
      description: httpOnly refresh cookie, path /api/auth, set at sign-in.
  schemas:
    Error:
      type: object
      required:
        - status
        - message
        - timestamp
        - path
      properties:
        status:
          type: string
          example: Forbidden
          description: HTTP status text
        message:
          type: string
          example: Not permitted
        details:
          description: Extra data on some errors, e.g. `{ perm }` on 403, `{ blockers }` when a document cannot be filed yet
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /users
