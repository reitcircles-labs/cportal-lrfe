openapi: 3.1.0
info:
  title: extracts service
  version: 0.1.0
  description: >-
    Ownership extracts: the register of extracts issued for an owner on a land record's current approved version once it is on the
    blockchain, each valid or revoked. Design: services/extracts/README.md.


    Paths here are the service's own, on port 3507. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3507
    description: extracts directly (local development)
tags:
  - name: Extracts
    description: The register of ownership extracts.
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /extracts:
    post:
      tags:
        - Extracts
      summary: Issue an extract of a land record's current version for an owner
      description: >-
        `{ recordId, versionNumber, ownerIndex, idNo, documentSeen }`: the owner chosen on the current version, the ID number typed from the
        identity document shown, and `documentSeen: true`. 201 with the register row: `id`, `recordId`, `recordNo`, `versionNumber`,
        `issuedById`, `issuedByName`, `ownerIndex`, `ownerName`, `ownerIdLast4` (the last four characters of the owner's ID number; the rest
        is not kept), `documentSeen`, `issuedAt`, `token` (random, for the public check), `status` `valid`, `isCurrentVersion`. 400 without
        `documentSeen: true`. 409 when the record has no approved version, `versionNumber` is no longer the current one, there is no such
        owner, the ID number does not match the owner's on the version, or the version is not on the blockchain yet (its anchoring
        confirmed); 503 when that cannot be checked; 404 when there is no such record.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: postExtracts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - recordId
                - versionNumber
                - ownerIndex
                - idNo
                - documentSeen
              properties:
                recordId:
                  type: string
                  format: uuid
                versionNumber:
                  type: integer
                  minimum: 1
                ownerIndex:
                  type: integer
                  minimum: 0
                idNo:
                  type: string
                  minLength: 1
                  maxLength: 40
                documentSeen:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts
    get:
      tags:
        - Extracts
      summary: The extracts of a land record, newest first
      description: >-
        `{ items }`: the register rows of `recordId`, valid and revoked (`revokedAt`, `revokedByName`, `revokeReason`), each with
        `isCurrentVersion`: its version is still the record's current one.


        **Access:** Signed-in user with permission `extract.issue`.
      operationId: getExtracts
      parameters:
        - name: recordId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts
  /extracts/{id}/revoke:
    post:
      tags:
        - Extracts
      summary: Revoke an extract, with the reason
      description: |-
        `{ reason }`. The updated register row, `status` `revoked`; it stays in the register. 409 when it is already revoked.

        **Access:** Signed-in user with permission `extract.issue`.
      operationId: postExtractsIdRevoke
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - extract.issue
      x-gateway-path: /api/extracts/{id}/revoke
