openapi: 3.1.0
info:
  title: land-records service
  version: 0.1.0
  description: >-
    Land records: filed EDRMS documents aggregated per parcel, versioned, reviewed by a second person before each version is committed, and
    sealed. Design: services/land-records/README.md.


    Paths here are the service's own, on port 3505. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3505
    description: land-records directly (local development)
tags:
  - name: Records
    description: Land records, their versions and seal chain.
  - name: Documents
    description: Filed EDRMS documents, found for land records.
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /records/catalogue:
    get:
      tags:
        - Service
      summary: Parcel kinds and their JSON Schemas
      description: >-
        `{ parcelKinds: [{ id, label, schemaVersion, schema, draftSchema }] }`. A draft is validated against `draftSchema` (types only), a
        version submitted for review against `schema`.


        **Access:** Any signed-in user.
      operationId: getRecordsCatalogue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/records/catalogue
  /records:
    get:
      tags:
        - Records
      summary: List and search land records
      description: >-
        `{ items, total }`. `q` searches the record number, the parcel, owners' names and ID numbers, and document references. `status`:
        `draft` (never committed), `committed`, `in_review` (a version waits for approval), `needs_review` (a linked document was
        corrected).


        **Access:** Signed-in user with permission `record.view`.
      operationId: getRecords
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
