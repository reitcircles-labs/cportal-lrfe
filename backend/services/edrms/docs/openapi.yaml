# Generated by backend/scripts/openapi.js from the routes and docs/endpoints.js.
# Do not edit by hand: change those and run `npm run docs` in backend/.
openapi: 3.1.0
info:
  title: edrms service
  version: 0.1.0
  description: >-
    Sealed, versioned documents of record. Read by anyone who works with documents; written only by services (intake files, bpm applies
    approved amendments).


    Paths here are the service's own, on port 3502. Browsers call them through the gateway; each operation's `x-gateway-path` gives the
    /api/... path, and services/gateway/docs/openapi.yaml lists them all that way.
servers:
  - url: http://localhost:3502
    description: edrms directly (local development)
tags:
  - name: Documents
    description: Filed documents of record, their versions and content.
  - name: Filing
    description: "Service-to-service writes. Browsers cannot call these: they need a service token."
  - name: Service
    description: Health and metadata.
paths:
  /health:
    get:
      tags:
        - Service
      summary: Health check
      description: "**Access:** Public: no token needed."
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      security: []
  /catalogue:
    get:
      tags:
        - Service
      summary: Document types and record-metadata fields
      description: |-
        `{ docTypes, recordMetadataFields }`.

        **Access:** Any signed-in user.
      operationId: getCatalogue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-gateway-path: /api/document-catalogue
  /documents:
    post:
      tags:
        - Filing
      summary: File a document (intake only)
      description: >-
        multipart/form-data with a `meta` JSON field FIRST, then `file`. 201 `{ document, created: true }`, or 200 `{ document, created:
        false }` when the same source was already filed.


        **Access:** Service token only, from: `intake`. Browsers cannot call this.
      operationId: postDocuments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - meta
                - file
              properties:
                meta:
                  type: string
                  description: "JSON: document type, fields, provenance… (must come before the file)"
                file:
                  type: string
                  format: binary
                  description: the scanned file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - intake
      x-gateway-path: /api/documents
    get:
      tags:
        - Documents
      summary: Search filed documents
      description: >-
        `{ items, total }`. `q` searches numbers, references and field values. Filter on any extracted field with `field.<key>=<value>`,
        e.g. `field.property=Erf 1873, Klein Windhoek`.


        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: getDocuments
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: docType
          in: query
          required: false
          schema:
            type: string
            enum:
              - deed_of_transfer
              - deed_of_sale
              - deed_of_grant
              - sg_diagram
              - mortgage_bond
              - other
        - name: batchId
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
      x-gateway-path: /api/documents
  /documents/lookup:
    get:
      tags:
        - Documents
      summary: Find one document by a reference
      description: >-
        By `edrmsNo`, `instrumentRef` (e.g. T 2210/2008) or `sourceId` (the intake document id). 404 when there is none.


        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: getDocumentsLookup
      parameters:
        - name: edrmsNo
          in: query
          required: false
          schema:
            type: string
        - name: instrumentRef
          in: query
          required: false
          schema:
            type: string
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
      x-gateway-path: /api/documents/lookup
  /documents/{id}:
    get:
      tags:
        - Documents
      summary: One document with its fields, record metadata and version history
      description: >-
        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: getDocumentsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
      x-gateway-path: /api/documents/{id}
  /documents/{id}/versions/{n}:
    get:
      tags:
        - Documents
      summary: One version of a document
      description: >-
        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: getDocumentsIdVersionsN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
      x-gateway-path: /api/documents/{id}/versions/{n}
  /documents/{id}/content:
    get:
      tags:
        - Documents
      summary: Short-lived link to the file
      description: >-
        `{ url, version, mimeType, sha256, expiresIn }`. `?version=` defaults to the current version. Open `url` directly (it needs no
        token): a presigned S3 URL, or GET /content/{id}/{n} for local storage.


        **Access:** Signed-in user with any of `capture.view`, `verify.view`, `record.view`, `audit.view`, or a service token from `intake`,
        `land-records`, `audit`, `search`, `bpm`.
      operationId: getDocumentsIdContent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
        - serviceToken: []
      x-access:
        anyOf:
          - capture.view
          - verify.view
          - record.view
          - audit.view
        services:
          - intake
          - land-records
          - audit
          - search
          - bpm
      x-gateway-path: /api/documents/{id}/content
  /content/{id}/{n}:
    get:
      tags:
        - Documents
      summary: File content behind a signed link (local/memory storage)
      description: |-
        Use the `url` from GET /documents/{id}/content; `exp` and `sig` authorise it. 404 when expired or tampered with.

        **Access:** No token: the `exp` and `sig` of a signed link authorise it.
      operationId: getContentIdN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: exp
          in: query
          required: true
          schema:
            type: integer
        - name: sig
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      x-gateway-path: /api/document-content/{id}/{n}
  /documents/{id}/versions/{n}/verify:
    get:
      tags:
        - Documents
      summary: Integrity check of a version
      description: |-
        Recomputes the SHA-256 of the stored file and checks the seal: `{ intact, contentIntact, sealIntact, version, checkedAt, … }`.

        **Access:** Signed-in user with permission `audit.view`.
      operationId: getDocumentsIdVersionsNVerify
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: "n"
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []
      x-access:
        allOf:
          - audit.view
      x-gateway-path: /api/documents/{id}/versions/{n}/verify
  /documents/{id}/amendments:
    post:
      tags:
        - Filing
      summary: Apply an approved amendment (bpm only)
      description: >-
        Creates a new sealed version; the previous one is kept. Users request changes through bpm: POST
        /processes/document-amendment/instances. The approver must differ from the requester. Returns `{ document, version }`.


        **Access:** Service token only, from: `bpm`. Browsers cannot call this.
      operationId: postDocumentsIdAmendments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
                - expectedVersion
                - actor
                - approvedBy
              properties:
                reason:
                  type: string
                expectedVersion:
                  type: integer
                  minimum: 1
                changes:
                  type: array
                  items:
                    type: object
                    required:
                      - k
                      - v
                    properties:
                      k:
                        type: string
                      v:
                        type: string
                recordMetadata:
                  type: object
                actor:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: string
                      minLength: 1
                    name:
                      type: string
                approvedBy:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: string
                      minLength: 1
                    name:
                      type: string
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request (failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - serviceToken: []
      x-access:
        services:
          - bpm
      x-gateway-path: /api/documents/{id}/amendments
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/auth/login or /api/auth/mfa (15 minutes; renew with POST /api/auth/refresh).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token (typ "service"), signed with the shared JWT_SECRET. Not available to browsers.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lrfe_rt
      description: httpOnly refresh cookie, path /api/auth, set at sign-in.
  schemas:
    Error:
      type: object
      required:
        - status
        - message
        - timestamp
        - path
      properties:
        status:
          type: string
          example: Forbidden
          description: HTTP status text
        message:
          type: string
          example: Not permitted
        details:
          description: Extra data on some errors, e.g. `{ perm }` on 403, `{ blockers }` when a document cannot be filed yet
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /users
