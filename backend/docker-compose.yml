# Development helpers: PostgreSQL and NATS in containers, for running the services with npm.
#
#   docker compose up -d postgres       the database, on localhost:${POSTGRES_HOST_PORT:-5433}
#                                       (DB_CONNECTION_STRING=postgres://lrfe:lrfe@localhost:5433/lrfe)
#   docker compose up -d nats           the event bus, on localhost:${NATS_HOST_PORT:-4222}
#
# The whole application in containers (web app, every service, for a site install) is in
# ../deploy/docker-compose.yml: see ../deploy/README.md.

name: lrfe-dev

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lrfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lrfe}
      POSTGRES_DB: ${POSTGRES_DB:-lrfe}
    ports:
      # 5432 is often taken by a local Postgres
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # JetStream on, for the durable events of the audit trail; its monitoring page on 8222
  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222", "-n", "lrfe"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - natsdata:/data

volumes:
  pgdata:
  natsdata:
