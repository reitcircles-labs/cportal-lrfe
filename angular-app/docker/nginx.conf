# The web container (angular-app/Dockerfile): serves the built app and passes /api/... to the
# gateway container, unchanged. Plain HTTP on 8080: HTTPS is ended in front of it (the site's
# reverse proxy or load balancer; see deploy/README.md).

# $lrfe_document_origins: the other origins documents may come from (the S3 bucket), for the
# content security policy; written on every start by docker/site-config.sh (API-822)
include /tmp/lrfe/document-origins.conf;

# The scheme the user's browser used: the site's proxy in front says so (https); else this one's
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # IPv4 only: Docker's networks are IPv4, and an IPv6 listen fails on hosts without IPv6
    listen 8080;
    server_name _;
    server_tokens off;

    # nosniff, framing, referrer, content security policy, … (also for /api/ and /healthz)
    include /etc/nginx/lrfe-security-headers.conf;

    # Scans are uploaded through /api/intake (INTAKE_MAX_FILE_MB, 50 in deploy/docker-compose.yml).
    client_max_body_size 55m;

    # Docker's DNS, read again when the gateway container is replaced (its address changes)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API: everything under /api goes to the gateway, unchanged ----
    # (^~: also paths that end like a build file, e.g. .js, never go to the file rule below)
    location ^~ /api/ {
        set $gateway http://gateway:3500;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # stream uploads and file downloads instead of buffering them on disk
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- the app ----
    root /usr/share/nginx/html;
    index index.html;

    # Build files have a content hash in their name (main-2HPONEO6.js): cache them for a year.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/lrfe-security-headers.conf;
    }

    # index.html must never be cached, or browsers keep loading an old build after an upgrade.
    # The app uses #/ routes (#/login, #/invite?token=…), so every page is index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/lrfe-security-headers.conf;
    }

    # The organisation's settings (API-712), written from the site's .env when the container starts
    # (docker/site-config.sh). Read anew on every start of the app, never cached. Without the file
    # (404) the app uses its defaults.
    location = /config.json {
        alias /tmp/lrfe/config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/lrfe-security-headers.conf;
    }

    # for the container's health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
