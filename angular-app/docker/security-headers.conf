# The browser security headers of every answer (API-822, found by the penetration tests).
# Included in the server block and in each location that sets its own headers: nginx drops the
# server's add_header lines in a location that has any of its own.

add_header X-Content-Type-Options "nosniff" always;
# the scan viewer shows documents in a frame from the same origin; nothing else may frame the app
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

# What the app may load: its own scripts only; its styles plus Angular's inline component styles;
# the fonts its build inlines from Google Fonts (src/styles); documents and images from its own
# API, as blob: (scans, PDFs, extracts) or from the site's S3 bucket ($lrfe_document_origins,
# written by docker/site-config.sh); requests to its own origin only. object-src keeps the
# browser's PDF viewer working in the document frames.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: $lrfe_document_origins; frame-src 'self' blob: $lrfe_document_origins; object-src 'self' blob: $lrfe_document_origins; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# no camera, microphone, location or devices: the app uses none (scans arrive as uploaded files)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
