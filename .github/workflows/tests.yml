# Backend unit tests and the end-to-end browser tests (e2e/README.md).
#
#   every pull request and push to main   backend tests, API docs check, e2e on the in-memory stack
#                                         lint and format checks (blocking, docs/coding-guide.md)
#   nightly, and on demand (Run workflow)  the same e2e suite on PostgreSQL as well
#   both                                   the penetration tests: quick on a PR, deep nightly (security/README.md)
#
# On failure, the Playwright HTML report and test-results (screenshots, videos, traces) are kept as
# artifacts of the run for 14 days.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Blocking: a lint error or an unformatted file fails the build (docs/coding-guide.md).
      - name: Lint
        run: npm run lint
      # also when Lint failed, so one run shows both
      - name: Format
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Findings per area
        if: ${{ !cancelled() }}
        run: npm run -s lint:report >> "$GITHUB_STEP_SUMMARY"

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: NATS server, for the event-bus tests
        run: npm run nats -- --install
      - run: npm test
      - name: API docs are up to date
        run: npm run docs:check

  e2e:
    name: e2e (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL nightly and on demand only: it repeats the whole suite on a fresh database
        db: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["memory","postgres"]' || '["memory"]') }}
    env:
      E2E_DB: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            angular-app/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix angular-app
          npm ci --prefix e2e
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            backend/.tools
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json', 'backend/scripts/nats.js') }}
      - name: Browser and NATS server
        run: |
          (cd e2e && npx playwright install --with-deps chromium)
          npm --prefix backend run nats -- --install
      # The runner has PostgreSQL installed (not running); the test stack starts a private
      # instance of it under e2e/.stack/ (see e2e/stack/start-backend.mjs).
      - name: End-to-end tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.db }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # Penetration tests (API-814, security/README.md): black-box scans of the application in
  # containers, from the outside only. Every pull request: quick scans, signed out and signed in as
  # the records officer; nightly and on demand: deep scans as each main role. Report only for now:
  # the findings are in the job summary and the reports; PENTEST_BLOCKING: '1' makes a high finding
  # fail the job.
  pentest:
    name: penetration tests (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'pr' }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 240 || 40 }}
    env:
      PENTEST_BLOCKING: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Findings and verdict (unit tests)
        run: node --test security/*.test.mjs
      - name: Scans
        run: node security/scan.mjs --level ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'pr' }} --out security/.reports/run
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pentest-reports
          path: security/.reports/run
          retention-days: 14
